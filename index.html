    --panel-rgb:255,255,255;
    --grid-line:rgba(30,58,95,.05);

     unset preference follows the system) and an explicit [data-theme]

      --danger:#f27272; --danger-soft:rgba(242,114,114,.16);
      --ok:#4ade80; --ok-soft:rgba(74,222,128,.16);
      --focus:#7fb8e8;
      --shadow-xs:0 1px 2px rgba(0,0,0,.3);
      --shadow-sm:0 2px 10px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
      --shadow-md:0 10px 28px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
      --shadow-lg:0 24px 56px rgba(0,0,0,.55), 0 6px 16px rgba(0,0,0,.35);
      --coa-tuition:#5b9fe8; --coa-housing:#3ec996; --coa-other:#f2895c;
      --banner-info-border:rgba(79,143,208,.35); --banner-warn-border:rgba(240,169,78,.35); --banner-warn-text:#f0a94e; --banner-escalate-border:rgba(242,114,114,.35);
      --role-student-bg:rgba(129,140,248,.18); --role-student-text:#c7d2fe; --role-parent-bg:rgba(236,72,153,.18); --role-parent-text:#f9a8d4;
      --panel-rgb:22,32,47;
      --grid-line:rgba(127,184,232,.055);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#eef2f7; --ink-soft:#c3ccd6; --ink-faint:#8996a6;
    --bg:#0d1420; --panel:#16202f; --line:#29394d; --line-soft:#1f2b3b;
    --brand:#4f8fd0; --brand-dark:#8fc6ed; --brand-soft:rgba(79,143,208,.18); --brand-2:#6fb0e0;
    --accent:#94a3b8; --accent-soft:rgba(148,163,184,.16);
    --warn:#f0a94e; --warn-soft:rgba(240,169,78,.16);
    --danger:#f27272; --danger-soft:rgba(242,114,114,.16);
    --ok:#4ade80; --ok-soft:rgba(74,222,128,.16);
    --focus:#7fb8e8;
    --shadow-xs:0 1px 2px rgba(0,0,0,.3);
    --shadow-sm:0 2px 10px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 10px 28px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
    --shadow-lg:0 24px 56px rgba(0,0,0,.55), 0 6px 16px rgba(0,0,0,.35);
    --coa-tuition:#5b9fe8; --coa-housing:#3ec996; --coa-other:#f2895c;
    --banner-info-border:rgba(79,143,208,.35); --banner-warn-border:rgba(240,169,78,.35); --banner-warn-text:#f0a94e; --banner-escalate-border:rgba(242,114,114,.35);
    --role-student-bg:rgba(129,140,248,.18); --role-student-text:#c7d2fe; --role-parent-bg:rgba(236,72,153,.18); --role-parent-text:#f9a8d4;
    --panel-rgb:22,32,47;
    --grid-line:rgba(127,184,232,.055);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/44px 44px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/44px 44px,
      radial-gradient(1100px 520px at 12% -8%, rgba(30,58,95,.06), transparent 55%),
      radial-gradient(900px 460px at 100% 0%, rgba(61,122,181,.06), transparent 50%),
      var(--bg);
    color:var(--ink);
    font:15.5px/1.6 var(--font-body);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:var(--brand-dark);}
  button{font:inherit;}
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:800; letter-spacing:-0.015em; line-height:1.2; margin:0 0 8px 0; color:var(--ink);}
  p{margin:0 0 10px 0;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  @media (prefers-reduced-motion: no-preference){
    .reveal{opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.65,.3,1), transform .7s cubic-bezier(.2,.65,.3,1);}
    .reveal.is-visible{opacity:1; transform:translateY(0);}
  }
  :focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:4px;}
  .skip-link{position:absolute; left:8px; top:-48px; background:var(--ink); color:#fff; padding:8px 14px; border-radius:8px; z-index:100; transition:top .15s; font-weight:600;}
  .skip-link:focus{top:8px;}

  /* Shell — left sidebar */
  .shell{display:flex; min-height:100vh;}
  .sidebar{
    width:232px; flex:0 0 232px; background:var(--panel); border-right:1px solid var(--line);
    padding:22px 14px; position:sticky; top:0; height:100vh; overflow-y:auto; display:flex; flex-direction:column;
    box-shadow:1px 0 0 rgba(17,24,39,.02), var(--shadow-xs);
  }
  .brand{display:flex; align-items:center; gap:10px; padding:2px 8px 24px 8px;}
  .brand .mark{
    width:36px;height:36px;border-radius:11px; flex:0 0 36px;
    background:linear-gradient(135deg,var(--brand-2),var(--brand-dark));
    display:flex; align-items:center; justify-content:center; font-size:17px;
    box-shadow:0 6px 16px rgba(30,58,95,.32), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .brand strong{font-family:var(--font-display); font-size:18px; font-weight:800; letter-spacing:-0.02em; display:block; line-height:1.1;}
  .brand span{display:block; font-size:11px; color:var(--ink-faint); font-weight:600; letter-spacing:.02em; margin-top:1px;}
  nav.primary{display:flex; flex-direction:column; gap:2px;}
  nav.primary button{
    display:flex; align-items:center; gap:11px; text-align:left; width:100%;
    background:transparent; border:none; border-left:3px solid transparent; padding:10px 11px; border-radius:10px;
    color:var(--ink-soft); cursor:pointer; font-size:13.5px; font-weight:500; transition:background .14s,color .14s,border-color .14s;
  }
  nav.primary button:hover{background:var(--brand-soft); color:var(--brand-dark);}
  nav.primary button[aria-current="page"]{background:var(--brand-soft); color:var(--brand-dark); font-weight:700; border-left-color:var(--brand);}
  .role-switch{margin-top:20px; padding:13px; background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-sm); font-size:12px; color:var(--ink-faint); font-weight:600;}
  .role-switch select{width:100%; margin-top:7px; padding:7px 8px; border-radius:8px; border:1px solid var(--line); font-size:13px; font-family:var(--font-body); background:var(--panel); color:var(--ink);}
  .sidebar-footer{margin-top:auto; padding-top:18px; display:flex; flex-direction:column; gap:6px;}
  .autosave-note{font-size:11px; color:var(--ink-faint); font-weight:600; padding:2px 8px 6px; display:flex; align-items:center; gap:5px;}

  .main{flex:1; min-width:0;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:16px 28px; border-bottom:1px solid var(--line); background:rgba(var(--panel-rgb),.86);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    position:sticky; top:0; z-index:5;
  }
  .topbar h1{font-size:19px; margin:0;}
  .pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:5px 12px; border-radius:999px; background:var(--brand-soft); color:var(--brand-dark); font-weight:700; box-shadow:var(--shadow-xs);}
  .content{padding:28px; max-width:980px;}
  .content.wide{max-width:1200px;}

  /* Cards */
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:18px; box-shadow:var(--shadow-sm); transition:box-shadow .15s, border-color .15s;}
  .card h2{font-size:18px; letter-spacing:-0.01em;}
  .card h3{font-size:14.5px; font-weight:700;}
  .muted{color:var(--ink-faint); font-size:13px;}
  .grid{display:grid; gap:16px;}
  .grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
  .grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
  .eyebrow{font-family:var(--font-display); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.11em; color:var(--brand); margin:0 0 5px 0;}
  .lede{color:var(--ink-soft); font-size:14px; margin-bottom:4px;}

  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:11px 20px; border-radius:12px;
    border:1px solid var(--brand); background:linear-gradient(180deg, var(--brand-2), var(--brand)); color:#fff; font-weight:700; font-size:14px;
    font-family:var(--font-display); letter-spacing:-0.005em;
    cursor:pointer; text-decoration:none; transition:transform .12s, box-shadow .15s, background .15s;
    box-shadow:0 1px 2px rgba(30,58,95,.15);
  }
  .btn:hover{background:linear-gradient(180deg, var(--brand), var(--brand-dark)); border-color:var(--brand-dark); box-shadow:0 8px 20px rgba(30,58,95,.28); transform:translateY(-1px);}
  .btn:active{transform:translateY(0); box-shadow:0 2px 6px rgba(30,58,95,.2);}
  .btn.secondary{background:var(--panel); color:var(--brand-dark); border-color:var(--line); box-shadow:var(--shadow-xs);}
  .btn.secondary:hover{background:var(--brand-soft); border-color:var(--brand); box-shadow:var(--shadow-sm); transform:translateY(-1px);}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--ink-soft); padding:7px 11px; box-shadow:none; font-weight:600;}
  .btn.ghost:hover{background:var(--bg); box-shadow:none; transform:none;}
  .btn.small{padding:7px 13px; font-size:13px;}
  .btn[disabled]{opacity:.5; cursor:not-allowed; transform:none !important; box-shadow:none !important;}

  .badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; letter-spacing:.01em;}
  .badge.verified{background:var(--ok-soft); color:var(--ok);}
  .badge.reported{background:var(--brand-soft); color:var(--brand-dark);}
  .badge.confirm{background:var(--warn-soft); color:var(--warn);}
  .badge.estimated{background:var(--accent-soft); color:var(--accent);}
  .badge.role-student{background:var(--role-student-bg); color:var(--role-student-text);}
  .badge.role-parent{background:var(--role-parent-bg); color:var(--role-parent-text);}
  .badge.plain{text-transform:none; letter-spacing:0; font-weight:600;}

  .task-row{display:flex; gap:13px; padding:15px 6px; border-top:1px solid var(--line-soft); transition:background .12s;}
  .task-row:first-child{border-top:none;}
  .task-row:hover{background:rgba(30,58,95,.02); border-radius:10px;}
  .task-row input[type=checkbox]{width:20px;height:20px; margin-top:2px; accent-color:var(--brand); flex:0 0 20px; cursor:pointer;}
  .task-meta{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:8px; font-size:12px; color:var(--ink-faint);}
  .why-btn{background:none;border:none;color:var(--brand-dark); text-decoration:underline; text-underline-offset:2px; cursor:pointer; font-size:12px; padding:0; font-weight:600;}
  .task-title{font-size:15px; font-weight:600;}

  .howto-toggle{
    display:inline-flex; align-items:center; gap:5px; background:var(--brand-soft); border:1px solid transparent;
    color:var(--brand-dark); font-weight:700; font-size:12px; padding:5px 11px; border-radius:8px; cursor:pointer; transition:background .12s, box-shadow .12s;
  }
  .howto-toggle:hover{border-color:var(--brand); box-shadow:var(--shadow-xs);}
  .howto-box{
    margin-top:10px; padding:13px 15px; background:var(--bg); border:1px solid var(--line-soft); border-radius:var(--radius-sm);
  }
  .howto-box ol{margin:0; padding-left:20px;}
  .howto-box li{margin-bottom:7px; font-size:13.5px; color:var(--ink-soft);}
  .howto-box li:last-child{margin-bottom:0;}
  .howto-box .howto-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--brand-dark); margin-bottom:8px;}
  summary.howto-toggle{list-style:none;}
  summary.howto-toggle::-webkit-details-marker{display:none;}
  summary.howto-toggle::marker{content:"";}
  details[open] > summary.howto-toggle{background:var(--brand); color:#fff;}
  details[open] > summary.howto-toggle span{display:inline-block; transform:rotate(90deg);}
  summary.howto-toggle span{display:inline-block; transition:transform .12s;}

  table{width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums;}
  th,td{text-align:left; padding:11px 12px; border-bottom:1px solid var(--line-soft); vertical-align:top;}
  th{font-family:var(--font-display); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); border-bottom-color:var(--line);}
  tbody tr:hover{background:rgba(30,58,95,.02);}

  .fact-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; margin:14px 0;}
  .fact{background:var(--bg); border:1px solid var(--line-soft); border-radius:var(--radius-sm); padding:11px 13px; transition:border-color .12s;}
  .fact .fact-label{display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:5px;}
  .fact .fact-value{font-size:14.5px; color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums;}
  .deadline-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .deadline-list li{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; background:var(--bg); border:1px solid var(--line-soft); border-radius:var(--radius-sm); font-size:13px;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-weight:700; margin-bottom:6px; font-size:13.5px;}
  .field .hint{font-size:12px; color:var(--ink-faint); margin-bottom:8px;}
  .field select, .field input[type=text], .field input[type=number]{
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:var(--radius-sm); font-size:14px; font-family:var(--font-body); background:var(--panel); color:var(--ink);
    transition:border-color .12s, box-shadow .12s;
  }
  .field select:focus, .field input:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); outline:none;}
  .choice-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px;}
  .choice{
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:13px 15px; cursor:pointer; background:var(--panel);
    display:flex; align-items:flex-start; gap:10px; transition:border-color .12s, box-shadow .12s, background .12s;
  }
  .choice:hover{border-color:var(--brand); box-shadow:var(--shadow-xs);}
  .choice.selected{border-color:var(--brand); background:var(--brand-soft); box-shadow:0 0 0 1px var(--brand);}
  .choice input{margin-top:3px; accent-color:var(--brand);}
  .choice .label{font-weight:700; font-size:14px;}
  .choice .desc{font-size:12px; color:var(--ink-faint);}

  .progress-bar{height:7px; border-radius:99px; background:var(--line-soft); overflow:hidden; margin-bottom:20px;}
  .progress-bar>div{height:100%; background:linear-gradient(90deg,var(--brand-2),var(--brand-dark)); transition:width .2s;}

  .banner{border-radius:var(--radius-sm); padding:13px 16px; font-size:13px; margin-bottom:16px; border:1px solid transparent; box-shadow:var(--shadow-xs);}
  .banner.info{background:var(--brand-soft); border-color:var(--banner-info-border); color:var(--brand-dark);}
  .banner.warn{background:var(--warn-soft); border-color:var(--banner-warn-border); color:var(--banner-warn-text);}
  .banner.escalate{background:var(--danger-soft); border-color:var(--banner-escalate-border); color:var(--danger);}

  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal{background:var(--panel); color:var(--ink); border-radius:var(--radius-lg); max-width:520px; width:100%; padding:24px; max-height:85vh; overflow-y:auto; box-shadow:var(--shadow-lg);}
  .modal h3{margin-bottom:10px; font-size:18px;}
  .modal dl{font-size:13px;}
  .modal dt{font-weight:700; margin-top:10px; color:var(--ink-soft); font-family:var(--font-display); font-size:11px; text-transform:uppercase; letter-spacing:.04em;}
  .modal dd{margin:3px 0 0 0; color:var(--ink);}

  .stat{display:flex; align-items:center; gap:14px;}
  .stat .icon{
    font-size:19px; flex:0 0 auto; width:44px; height:44px; border-radius:13px;
    background:var(--brand-soft); display:flex; align-items:center; justify-content:center;
  }
  .stat .n{font-family:var(--font-display); font-size:24px; font-weight:800; line-height:1; letter-spacing:-0.02em; font-variant-numeric:tabular-nums;}
  .stat .l{display:block; font-size:12px; color:var(--ink-faint); margin-top:3px; font-weight:600;}

  .count{font-family:var(--font-display); font-size:13px; font-weight:800; color:var(--brand-dark); text-transform:uppercase; letter-spacing:.04em;}
  .stage-current{font-size:15.5px; font-weight:700; margin-top:9px;}
  .stage-list-toggle{margin-top:10px;}
  .stage-list{list-style:none; margin:10px 0 0 0; padding:0; display:flex; flex-direction:column; gap:7px;}
  .stage-list li{display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ink-soft);}
  .stage-list li.done{color:var(--ink-faint);}
  .stage-list .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;background:var(--line);}
  .stage-list li.done .dot{background:var(--ok);}
  .stage-list li.current .dot{background:var(--brand); box-shadow:0 0 0 3px var(--brand-soft);}

  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; flex-wrap:wrap;}
  .tabs button{background:none; border:none; padding:11px 15px; font-weight:700; font-size:13px; color:var(--ink-faint); cursor:pointer; border-bottom:2px solid transparent; transition:color .12s, border-color .12s;}
  .tabs button:hover{color:var(--brand-dark);}
  .tabs button[aria-selected="true"]{color:var(--brand-dark); border-color:var(--brand);}

  .disclaimer-bar{background:linear-gradient(90deg,var(--ink),#111827); color:#fff; font-size:12px; padding:9px 24px; text-align:center; letter-spacing:.01em;}
  .disclaimer-bar a{color:#8ec9f5; font-weight:600;}

  .consent-banner{
    position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--panel); border-top:1px solid var(--line);
    box-shadow:var(--shadow-lg); padding:16px 22px; display:flex; flex-wrap:wrap; align-items:center; gap:14px; justify-content:space-between;
  }
  .consent-banner p{margin:0; font-size:13px; color:var(--ink-soft); max-width:640px;}
  .consent-banner .actions{display:flex; gap:8px; flex-wrap:wrap;}
  /* Prevents the fixed consent banner from covering page content/CTAs on
     short viewports — toggled on <body> whenever the banner is showing. */
  body.consent-open .content{padding-bottom:190px;}

  @media (max-width:840px){
    .welcome-hero-grid{grid-template-columns:1fr !important;}
    .welcome-mission-grid{grid-template-columns:1fr !important;}
    .how-steps-line{display:none;}
    .shell{flex-direction:column;}
    .sidebar{
      width:100%; height:auto; position:relative; border-right:none; border-bottom:1px solid var(--line);
      display:flex; flex-direction:row; align-items:center; padding:12px 16px; box-shadow:none;
    }
    .brand{padding:0; margin-right:auto;}
    #mobile-nav-toggle-btn{display:inline-flex !important; padding:11px 13px !important; font-size:16px; margin-right:6px; position:relative; z-index:70;}
    nav.primary{display:none;}
    nav.primary.mobile-open{
      display:flex; flex-direction:column; gap:2px; position:fixed; inset:0; top:0; z-index:60;
      background:var(--bg); padding:70px 16px 24px; overflow-y:auto;
    }
    nav.primary.mobile-open button{padding:14px 12px; font-size:15px; border-radius:10px;}
    .role-switch{display:none;}
    /* Rather than hiding these entirely (Install/Export/Clear matter most
       on mobile, where PWA installs actually happen), collapse them into a
       compact icon-only strip next to the brand instead of a full column. */
    .sidebar-footer{
      margin-top:0; padding-top:0; flex-direction:row; align-items:center; gap:2px; flex:0 0 auto;
    }
    .sidebar-footer .autosave-note{display:none;}
    .sidebar-footer .btn{width:auto !important; padding:11px !important;}
    .sidebar-footer .btn-label{display:none;}
    #print-btn, #theme-toggle-btn, #shell-lang-toggle-btn{padding:11px 12px !important;}
    .content{padding:18px;}
    .mobile-nav{
      position:fixed; bottom:0; left:0; right:0; background:rgba(var(--panel-rgb),.92); backdrop-filter:blur(10px); border-top:1px solid var(--line);
      display:flex; justify-content:space-around; padding:9px 4px; z-index:20; box-shadow:0 -4px 16px rgba(17,24,39,.06);
    }
    .mobile-nav button{background:none;border:none;font-size:11px;color:var(--ink-faint);display:flex;flex-direction:column;align-items:center;gap:3px; padding:4px; font-weight:600;}
    .mobile-nav button[aria-current="page"]{color:var(--brand-dark); font-weight:700;}
    body{padding-bottom:64px;}
  }
  @media (min-width:841px){ .mobile-nav{display:none;} }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important;} }

  /* ---- Print ----
     Forced light regardless of theme (saves ink, guarantees contrast on
     paper) — the app's dark palette assumes a backlit screen, not paper.
     Chrome/nav/mobile-nav/banners/modals/buttons are all interaction-only,
     so they're hidden; every <details> disclosure is forced open so
     nothing a parent or student would want on paper stays collapsed. */
  @media print{
    :root, :root[data-theme]{
      color-scheme: light;
      --ink:#1e293b; --ink-soft:#475569; --ink-faint:#64748b;
      --bg:#ffffff; --panel:#ffffff; --line:#d1d5db; --line-soft:#e5e7eb;
      --brand:#1e3a5f; --brand-dark:#132a45; --brand-soft:#e7f0f8; --brand-2:#3d7ab5;
      --accent:#64748b; --accent-soft:#eef1f4;

"use strict";

/* =========================================================================
   COMPASS — single-file app. No build step, no dependencies beyond Google
   Fonts. To find a section, search for its banner heading below:

     PWA SHELL          — runtime icon/manifest generation, install prompt
     DATA LAYER          — SOURCES, COLLEGES, STATE_AID, SCHOLARSHIPS (every
                            sourced fact — add new colleges/scholarships here)
     GUIDE                — general (non-personalized) reference articles
     BASE_TASKS / RULES   — the rules engine that generates personalized
                             tasks/warnings from onboarding answers
     STATE                — the single mutable state object + EXAMPLE_* data
     PERSISTENCE          — localStorage autosave, manual export/import code,
                             and URL hash sync (back/forward + bookmarkable)
     RENDERING            — every render*()/attach*Handlers() pair, one per
                             screen; render() is the one entry point that
                             re-draws everything and is called after any
                             state mutation (see "the render loop" below)
     Analytics + consent  — GA4 stub (no-ops until a real property ID exists)
     Startup               — hydrates from storage, then the first render()

   The render loop: this app has no framework. Event handlers mutate the
   plain `state` object directly, then call render(), which re-generates
   the whole visible DOM from scratch as an HTML string. There's no diffing
   — if you add a new interactive element, give it a stable id/data-attr,
   render it from state, and wire its listener inside the matching
   attach*Handlers() function, called every render.
   ========================================================================= */

/* =========================================================================
   PWA SHELL — generates the app icon at runtime (canvas) and a web app
   manifest (as a Blob URL) so installability doesn't need any separate
   icon/manifest files, keeping this a single HTML file. Real per-platform
   caveats, so nothing here is oversold:
    - A service worker (needed for true offline caching) can't be added
      this way — browsers only allow registering a service worker script
      that's fetched over http(s), never a blob: or data: URL, so that's
      not achievable while staying a single file. This app works fine
      without one; it just won't work with zero network on repeat visits.
    - "Add to Home Screen" / install prompts generally require the page
      be served over https (or http://localhost) — opening this file
      directly (file://) won't be installable in most browsers, even
      though everything below still runs and does no harm.
   ========================================================================= */
function makeIconDataUrl(size){
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  const r = size * 0.22;
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, "#3d7ab5");
  grad.addColorStop(1, "#132a45");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.arcTo(size, 0, size, size, r);
  ctx.arcTo(size, size, 0, size, r);
  ctx.arcTo(0, size, 0, 0, r);
  ctx.arcTo(0, 0, size, 0, r);
  ctx.closePath();
  ctx.fill();
  ctx.font = Math.round(size * 0.56) + "px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("🧭", size / 2, size / 2 + size * 0.03);
  return canvas.toDataURL("image/png");
}
function setupPwaShell(){
  try {
    const icon512 = makeIconDataUrl(512);
    const icon192 = makeIconDataUrl(192);
    const icon180 = makeIconDataUrl(180);
    const icon32 = makeIconDataUrl(32);
    const favicon = document.getElementById("app-favicon-link");
    if (favicon) favicon.href = icon32;
    const touchIcon = document.getElementById("app-touch-icon-link");
    if (touchIcon) touchIcon.href = icon180;
    const manifest = {
      name: "Compass — College & Financial Aid Navigator",
      short_name: "Compass",
      description: "A personalized roadmap for paying for California college — FAFSA, state aid, scholarships, and comparing offers.",
      start_url: location.pathname + location.search,
      scope: location.pathname,
      display: "standalone",
      background_color: "#0d1420",
      theme_color: "#0d1420",
      icons: [
        { src: icon192, sizes: "192x192", type: "image/png", purpose: "any" },
        { src: icon192, sizes: "192x192", type: "image/png", purpose: "maskable" },
        { src: icon512, sizes: "512x512", type: "image/png", purpose: "any" },
        { src: icon512, sizes: "512x512", type: "image/png", purpose: "maskable" },
      ],
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    const manifestLink = document.getElementById("app-manifest-link");
    if (manifestLink) manifestLink.href = URL.createObjectURL(blob);
  } catch (e) {
    // Canvas/Blob unsupported in this environment — app still works fully, just without install icons.
  }
}
setupPwaShell();

let deferredInstallPrompt = null;
let searchDebounceTimer = null; // avoids a full re-render (rebuilding every college card) on each keystroke
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  state.installPromptAvailable = true;
  render();
});
window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  state.installPromptAvailable = false;
  render();
});

function guideLink(articleId, label){

}

function fmtDate(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-US", {year:"numeric", month:"long", day:"numeric"});
}
function daysUntil(iso){
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const target = new Date(iso + "T00:00:00");
  return Math.round((target - today) / 86400000);
}
function deadlineStatusLabel(days){
  if (days < 0) return {text:t("common.passed"), cls:"confirm"};
  if (days <= 21) return {text:t("common.dueSoon"), cls:"confirm"};
  return {text:t("common.upcoming"), cls:"reported"};
}
/* Sticker-price threshold below which a college gets the more optimistic
   "potentially affordable" badge, by reported household income range.
   This is NOT a net-price or EFC/SAI calculation — it's a rough proxy for
   "how much need-based grant aid (Pell, Cal Grant, institutional aid) a
   family in this bracket typically has access to," which is why the
   threshold goes UP for lower incomes rather than down: a lower-income
   family is likelier to have most of a higher sticker price covered by
   grants, while a higher-income family gets little to no need-based aid
   and has to actually cover close to the sticker price itself. Always
   paired with "still depends on your real aid offer" — this never claims
   to know what a family will actually pay. */
const AFFORDABILITY_THRESHOLDS_BY_INCOME = {
  "Under $30,000": 65000,
  "$30,000–$60,000": 55000,
  "$60,000–$110,000": 45000,
  "Over $110,000": 35000,
};
const AFFORDABILITY_DEFAULT_THRESHOLD = 40000; // used when income wasn't shared
function affordabilityStatus(college, ctx){
  if (college.coaStatus === "requires_confirmation") return {key:"insufficient", text:"Insufficient info — cost not yet independently verified", cls:"confirm"};
  if (college.coa == null) return {key:"insufficient", text:"Must complete net price calculator", cls:"confirm"};
  const income = ctx && ctx.incomeRange;
  const threshold = AFFORDABILITY_THRESHOLDS_BY_INCOME[income] || AFFORDABILITY_DEFAULT_THRESHOLD;
  const basis = income && AFFORDABILITY_THRESHOLDS_BY_INCOME[income]
    ? "based on the income range you shared"
    : "using a general-purpose estimate since you haven't shared an income range";
  if (college.coa <= threshold) return {key:"potential", text:"Potentially affordable (" + basis + ") — still depends on your actual aid offer", cls:"reported"};
  return {key:"depends", text:"Depends heavily on aid (" + basis + ") — published cost alone is a real stretch", cls:"confirm"};
}

/* =========================================================================
   COST BREAKDOWN — every college carries a real, sourced coaBreakdown (its
   own itemized cost-of-attendance line items). Schools word these wildly
   differently ("Tuition & fees" vs. "Tuition"+"Fees" as two lines, "Room
   and board" vs. split "Housing"+"Food", etc.), so line items are folded
   into three canonical, comparable buckets before charting — otherwise the
   same $1,200 mandatory fee would silently land in a different visual
   bucket at two different schools purely because of how each one reported
   it. "Fee" items are grouped with tuition (not split out to "other") on
   purpose: that keeps every school's bucket totals comparable regardless
   of whether it reported fees combined with tuition or as their own line.
   Categorical colors are CVD-validated (dataviz skill reference palette,
   first three all-pairs-safe slots — appropriate here since this chart
   repeats as small multiples across every college card). */
function categorizeCoaItem(label){
  const l = label.toLowerCase();
  if (l.indexOf("loan") >= 0) return "other";
  if (l.indexOf("tuition") >= 0 || l.indexOf("fee") >= 0) return "tuition";
  if (l.indexOf("hous") >= 0 || l.indexOf("room") >= 0 || l.indexOf("rent") >= 0 ||
      l.indexOf("food") >= 0 || l.indexOf("board") >= 0 || l.indexOf("meal") >= 0) return "housing";
  return "other";
}
const COA_CATEGORIES = {
  tuition: { label:"Tuition & fees", varName:"--coa-tuition" },
  housing: { label:"Housing & food", varName:"--coa-housing" },
  other:   { label:"Books, transportation & other", varName:"--coa-other" },
};
function coaCategoryTotals(college){
  const bd = college.coaBreakdown;
  if (!bd) return null;
  const totals = { tuition:0, housing:0, other:0 };
  Object.keys(bd).forEach(label => { totals[categorizeCoaItem(label)] += bd[label]; });
  const sum = totals.tuition + totals.housing + totals.other;
  if (!sum) return null;
  return { totals, sum };
}
function renderCoaChart(college){
  const cat = coaCategoryTotals(college);
  if (!cat) return "";
  const { totals, sum } = cat;
  const segs = ["tuition","housing","other"].filter(k => totals[k] > 0).map(k => {
    const pct = totals[k] / sum * 100;
    const meta = COA_CATEGORIES[k];
    return { key:k, pct, meta, amount:totals[k] };
  });
  const barHtml = segs.map((s,i) => (
    '<div style="flex:' + s.pct + ' 0 0; background:var(' + s.meta.varName + ');' + (i < segs.length-1 ? 'border-right:2px solid var(--panel);' : '') + '" role="img" aria-label="' + esc(s.meta.label) + ': $' + s.amount.toLocaleString() + ' (' + Math.round(s.pct) + '%)"><title>' + esc(s.meta.label) + ': $' + s.amount.toLocaleString() + ' (' + Math.round(s.pct) + '%)</title></div>'
  )).join("");
  const captionHtml = segs.map(s => (
    '<span style="display:inline-flex; align-items:center; gap:4px;"><span style="width:8px;height:8px;border-radius:2px;background:var(' + s.meta.varName + ');display:inline-block;flex:0 0 auto;"></span>' + esc(s.meta.label) + ' ' + Math.round(s.pct) + '%</span>'
  )).join('<span style="color:var(--line);">·</span>');
  const itemsHtml = Object.keys(college.coaBreakdown).map(label => (
    '<li style="display:flex; justify-content:space-between; gap:10px;"><span>' + esc(label) + '</span><span style="font-weight:600; white-space:nowrap;">$' + college.coaBreakdown[label].toLocaleString() + '</span></li>'
  )).join("");
  return '\
    <div style="margin-top:12px;">\
      <div style="display:flex; height:10px; border-radius:99px; overflow:hidden; background:var(--line-soft);">' + barHtml + '</div>\
      <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:7px; font-size:11.5px; color:var(--ink-faint); font-weight:600;">' + captionHtml + '</div>\
      <details class="howto" style="margin-top:9px;">\
        <summary class="howto-toggle"><span aria-hidden="true">▸</span> See full itemized cost breakdown</summary>\
        <div class="howto-box"><ul style="list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:13px;">' + itemsHtml + '</ul></div>\
      </details>\
    </div>';
}

/* =========================================================================
   PERSISTENCE — autosave to this device only, via localStorage. Nothing
   here is ever transmitted anywhere; it's the same roadmap data the old
   copy/paste "save code" carried, just written automatically instead of
   by hand so progress survives a reload or closed tab without any action.
   The manual export/import code (below) is kept as a secondary option for
   moving progress to a different browser or device, or as a backup.
   ========================================================================= */
const STORAGE_KEY = "compass-roadmap-v1";
function persistablePayload(){
  return {
    route: state.route,
    onboardingStep: state.onboardingStep,
    role: state.role,
    answers: state.answers,
    savedCollegeIds: state.savedCollegeIds,
    completedTaskIds: state.completedTaskIds,
    onboardingComplete: state.onboardingComplete,
    offers: state.offers,
    privacyConsent: state.privacyConsent,
    theme: state.theme,
    lang: state.lang,
  };
}
function saveToStorage(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(persistablePayload()));
    if (state.storageUnavailable) state.storageUnavailable = false;
  } catch (e) {
    state.storageUnavailable = true;
  }
}
function applyPersistedPayload(payload){
  state.answers = payload.answers || {};
  state.savedCollegeIds = payload.savedCollegeIds || [];
  state.completedTaskIds = payload.completedTaskIds || [];
  state.role = payload.role || "student";
  state.offers = payload.offers || [];
  state.onboardingComplete = !!payload.onboardingComplete;
  state.onboardingStep = payload.onboardingStep || 0;
  state.privacyConsent = payload.privacyConsent != null ? payload.privacyConsent : null;
  state.theme = payload.theme || "dark";
  state.lang = payload.lang || "en";
  state.route = payload.route || (state.onboardingComplete ? "dashboard" : "welcome");
  // Never resume on an in-between/transient screen from a previous session.
  if (state.route === "onboarding" && state.onboardingComplete) state.route = "dashboard";
}
function loadFromStorage(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    applyPersistedPayload(JSON.parse(raw));
    return true;
  } catch (e) {
    return false;
  }
}
function clearStoredData(){
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  state.route = "welcome";
  state.onboardingStep = 0;
  state.role = "student";
  state.answers = {};
  state.savedCollegeIds = [];
  state.completedTaskIds = [];
  state.onboardingComplete = false;
  state.offers = [];
  state.activeWhy = null;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  render();
}

/* ---- Manual export/import code — secondary path for moving progress to
   another browser/device, or a backup outside this device's storage. ---- */
function encodeState(){
  return btoa(encodeURIComponent(JSON.stringify(persistablePayload())));
}
function restoreFromCode(code){
  try {
    const payload = JSON.parse(decodeURIComponent(atob(String(code).trim())));
    applyPersistedPayload(payload);
    saveToStorage();
    return true;
  } catch (e) {
    return false;
  }
}

/* ---- URL sync — reflects state.route in location.hash so the browser's
   own back/forward buttons work, and a bookmarked or shared link lands on
   the right screen. Deliberately scoped to shell routes only (post-
   onboarding); welcome/onboarding are too transient for hash noise. ---- */
const VALID_HASH_ROUTES = ["dashboard","guide","colleges","deadlines","fafsa","govaid","scholarships","offers","questions","family","help","privacy"];
function syncRouteToUrl(){
  if (!state.onboardingComplete || VALID_HASH_ROUTES.indexOf(state.route) < 0) return;
  const hash = "#" + state.route;
  if (location.hash !== hash) history.pushState({ route: state.route }, "", hash);
}
window.addEventListener("popstate", (e) => {
  const route = (e.state && e.state.route) || (location.hash ? location.hash.slice(1) : "");
  if (state.onboardingComplete && VALID_HASH_ROUTES.indexOf(route) >= 0) {
    state.route = route;
    render();
  }
});

    identities: [].concat(state.answers.ethnicity || [], state.answers.identityOther || [], state.answers.immigration === "undocumented" ? ["undocumented"] : [])
      .filter(v => v !== "prefer_not_to_answer"),
  };
}
function matchedScholarships(identities){
  if (!identities || !identities.length) return [];
  return SCHOLARSHIPS.filter(s => s.identityTags && s.identityTags.some(t => identities.includes(t)));
}

function computeGeneratedItems(){
  const ctx = ctxFromState();
  const items = [];
  RULES.forEach(rule => {
    if (rule.condition(ctx)) {
      const r = rule.result(ctx);
      items.push(Object.assign({ id:"rule-"+rule.id, ruleTrigger: rule.trigger }, r));
    }
  });
  return items;
}

/* ---- Calendar export (.ics) — pure client-side, no server, matches the
   rest of this app's no-backend design. All-day events; DTEND is
   exclusive per the iCalendar spec, hence the +1 day. ---- */
function icsEscape(s){
  return String(s == null ? "" : s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
}
function icsDataUri(title, dateISO, description){
  const start = dateISO.replace(/-/g,"");
  const endDate = new Date(dateISO + "T00:00:00");
  endDate.setDate(endDate.getDate() + 1);
  const end = endDate.toISOString().slice(0,10).replace(/-/g,"");
  const stamp = new Date().toISOString().replace(/[-:]/g,"").split(".")[0] + "Z";
  const uid = (title + dateISO).replace(/[^a-zA-Z0-9]/g,"") + "@compass-app";
  const lines = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Compass//Deadline Calendar//EN","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    "UID:" + uid,
    "DTSTAMP:" + stamp,
    "DTSTART;VALUE=DATE:" + start,
    "DTEND;VALUE=DATE:" + end,
    "SUMMARY:" + icsEscape(title),
    "DESCRIPTION:" + icsEscape(description || ""),
    "END:VEVENT","END:VCALENDAR",
  ];
  return "data:text/calendar;charset=utf-8," + encodeURIComponent(lines.join("\r\n"));
}
function addToCalendarLink(title, dateISO, description){
  return '<a class="why-btn" href="' + icsDataUri(title, dateISO, description) + '" download="' + esc(title.replace(/[^a-zA-Z0-9]+/g,"-").slice(0,40)) + '.ics">📅 ' + t("common.addToCalendar") + '</a>';
}

/* render() itself is just a safety wrapper — see renderInner() for the
   real logic. Without this, a bug anywhere on any single page (bad data,
   a typo in a new feature, anything) throws uncaught, root.innerHTML never
   gets reassigned, and the app silently freezes on stale content with no
   explanation and no way back in for the user. This can't prevent bugs,
   but it turns "frozen, unexplained, stuck" into "one visible error with
   a working way back to a known-good screen." */
function render(){
  try {
    document.documentElement.lang = state.lang === "es" ? "es" : "en";
    renderInner();
  } catch (err) {
    console.error("[Compass] render() failed:", err);
    renderCrashFallback(err);
  }
}
function renderCrashFallback(err){
  const root = document.getElementById("root");
  if (!root) return;
  root.innerHTML = '\
    <div class="content" style="max-width:560px;margin:80px auto 40px;">\
      <div class="card" style="text-align:center;">\
        <div style="font-size:32px;">⚠️</div>\
        <h2>Something went wrong showing this page</h2>\
        <p class="muted">This is a bug, not something you did — and your progress is safe either way, since it\'s saved on this device separately from what\'s on screen.</p>\
        <div style="display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap;">\
          <button class="btn" id="crash-recover-btn">Go to My Roadmap</button>\
          <button class="btn secondary" id="crash-reload-btn">Reload the page</button>\
        </div>\
        <details style="margin-top:16px; text-align:left;">\
          <summary class="howto-toggle" style="display:inline-flex;"><span aria-hidden="true">▸</span> Technical details</summary>\
          <div class="howto-box"><pre style="white-space:pre-wrap; word-break:break-word; font-size:11px; margin:0;">' + esc(String((err && err.stack) || err)) + '</pre></div>\
        </details>\
      </div>\
    </div>';
  const recoverBtn = document.getElementById("crash-recover-btn");
  if (recoverBtn) recoverBtn.addEventListener("click", () => {
    state.route = "dashboard";
    state.activeWhy = null;
    state.showSaveModal = false;
    render();
  });
  const reloadBtn = document.getElementById("crash-reload-btn");
  if (reloadBtn) reloadBtn.addEventListener("click", () => location.reload());
}
function renderInner(){
  saveToStorage();
  syncRouteToUrl();
  applyTheme();
  document.body.classList.toggle("consent-open", state.privacyConsent === null);
  const consentRoot = document.getElementById("consent-root");
  if (consentRoot) {
    consentRoot.innerHTML = state.privacyConsent === null ? renderConsentBanner() : "";
    if (state.privacyConsent === null) attachConsentHandlers();
  }
  const root = document.getElementById("root");
  const staleModal = document.getElementById("why-backdrop");
  if (staleModal) staleModal.remove();
  const staleSaveModal = document.getElementById("save-backdrop");
  if (staleSaveModal) staleSaveModal.remove();
  if (state.route === "welcome" || !state.onboardingComplete && state.route === "welcome") {
    root.innerHTML = renderWelcome();
    attachWelcomeHandlers();
    return;
  }
  if (state.route === "onboarding") {
    root.innerHTML = renderOnboarding();
    attachOnboardingHandlers();
    return;
  }
  root.innerHTML = renderShell();
  attachShellHandlers();
  if (state.activeWhy) {
    document.body.insertAdjacentHTML("beforeend", renderWhyModal());
    attachModalHandlers();
  }
  if (state.showSaveModal) {
    document.body.insertAdjacentHTML("beforeend", renderSaveModal());
    attachSaveModalHandlers();
  }
}

function attachWelcomeHandlers(){
  const startHandler = () => { state.route = "onboarding"; state.onboardingStep = 0; render(); };
  const btn = document.getElementById("start-btn");
  const btn2 = document.getElementById("start-btn-2");
  if (btn) btn.addEventListener("click", startHandler);
  if (btn2) btn2.addEventListener("click", startHandler);
  const langBtn = document.getElementById("lang-toggle-btn");
  if (langBtn) langBtn.addEventListener("click", () => {
    state.lang = state.lang === "es" ? "en" : "es";
    render();
  });
  const resumeToggle = document.getElementById("resume-toggle");
  const resumeBox = document.getElementById("resume-box");
  if (resumeToggle) resumeToggle.addEventListener("click", () => {
    resumeBox.style.display = resumeBox.style.display === "none" ? "block" : "none";
  });
  const resumeBtn = document.getElementById("resume-btn");
  if (resumeBtn) resumeBtn.addEventListener("click", () => {
    const input = document.getElementById("resume-input");
    const ok = restoreFromCode(input.value);
    if (ok) {
      render();
    } else {
      document.getElementById("resume-error").style.display = "block";
    }
  });
  setupScrollReveal();
}
function setupScrollReveal(){
  const els = document.querySelectorAll(".reveal");
  if (!els.length) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    els.forEach(el => el.classList.add("is-visible"));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("is-visible");
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15, rootMargin: "0px 0px -40px 0px" });
  els.forEach(el => io.observe(el));
}

      <span><span class="label">' + esc(labelText) + '</span>' + (hasDesc ? '<span class="desc" style="display:block;">' + esc(descText) + '</span>' : '') + '</span>\
    </label>';
  }).join("");
  const hintKey = "onboarding." + step.key + ".hint";
  const hintText = t(hintKey);
  const hasHint = hintText !== hintKey;

  return '\
  <div class="content" style="max-width:640px;margin:0 auto;padding-top:36px;">\
    <div class="muted" style="margin-bottom:8px;">' + t("onboarding.stepPrefix") + (i+1) + t("onboarding.stepMiddle") + steps.length + '</div>\
    <div class="progress-bar"><div style="width:' + pct + '%;"></div></div>\
    <div class="card">\
      <h2 style="font-size:20px;">' + esc(t("onboarding." + step.key + ".title")) + '</h2>\
      ' + (hasHint ? '<p class="muted">' + esc(hintText) + '</p>' : '') + '\
      <div class="choice-grid" id="choice-grid">' + optionsHtml + '</div>\
      <div style="display:flex; justify-content:space-between; margin-top:22px;">\
        <button class="btn secondary" id="ob-back" ' + (i===0?'disabled':'') + '>' + t("onboarding.back") + '</button>\
        <div>\
          <button class="btn ghost" id="ob-skip">' + t("onboarding.skip") + '</button>\
          <button class="btn" id="ob-next">' + (i===steps.length-1 ? t("onboarding.finish") : t("onboarding.continue")) + '</button>\
        </div>\
      </div>\
    </div>\

}
function attachOnboardingHandlers(){
  // Listen on the input's "change" event, not the label's "click" — clicking a
  // <label> wrapping a checkbox/radio makes the browser dispatch a click on
  // the label AND a separate delegated click on the input, so a click listener
  // on the label fires twice per user click. That's harmless for a plain
  // single-select assignment, but it silently cancels out a multi-select
  // toggle (add, then immediately remove again). "change" fires exactly once
  // per real state transition for both input types, so it's used for both.
  document.querySelectorAll('#choice-grid .choice input').forEach(input => {
    input.addEventListener("change", () => {
      const el = input.closest(".choice");
      const key = el.getAttribute("data-key");
      const val = el.getAttribute("data-value");
      const isMulti = el.getAttribute("data-multi") === "1";
      if (!isMulti) {
        state.answers[key] = val;
      } else {
        const arr = Array.isArray(state.answers[key]) ? state.answers[key].slice() : [];
        if (val === "prefer_not_to_answer") {
          // exclusive — picking this clears everything else
          state.answers[key] = arr.includes(val) ? [] : ["prefer_not_to_answer"];
        } else {
          const withoutPreferNot = arr.filter(v => v !== "prefer_not_to_answer");
          const idx = withoutPreferNot.indexOf(val);
          if (idx >= 0) withoutPreferNot.splice(idx, 1); else withoutPreferNot.push(val);
          state.answers[key] = withoutPreferNot;
        }
      }
      render();
    });
  });
  const back = document.getElementById("ob-back");
  const next = document.getElementById("ob-next");
  const skip = document.getElementById("ob-skip");
  if (back) back.addEventListener("click", () => { state.onboardingStep = Math.max(0, state.onboardingStep - 1); render(); });
  if (skip) skip.addEventListener("click", () => advanceOnboarding());
  if (next) next.addEventListener("click", () => advanceOnboarding());
}
function advanceOnboarding(){
  const steps = visibleSteps();
  if (state.onboardingStep >= steps.length - 1) {
    state.onboardingComplete = true;
    state.role = state.answers.who === "counselor" ? "student" : state.answers.who;
    state.route = "dashboard";
  } else {
    state.onboardingStep += 1;
  }
  render();
}

const STAGES = [
  "Understand the process","Set a family budget","Build a financially balanced college list",
  "Gather financial documents","Complete FAFSA",
  "Apply for scholarships","Track portals & verification",
  "Review decisions & offers","Appeal when appropriate","Choose an affordable college","Complete enrollment requirements",

/* Real, checkable completion signals for the first 5 stages only. The
   other 6 stages in STAGES (scholarships through enrollment) don't have
   an app feature that can actually detect "done" yet — rather than guess,
   currentStageIndex() stops advancing past the last stage it can verify,
   so the tracker never claims progress the user hasn't actually made
   (this used to silently mark stages 1-3 "done" the instant onboarding
   finished, since the old logic only ever looked at two BASE_TASKS). */
function stageCompletionChecks(){
  const stage4Tasks = BASE_TASKS.filter(t => t.stage === 4).map(t => t.id);
  return [
    true, // 1. Understand the process — implied by finishing onboarding (gated separately below)
    !!state.answers.incomeRange && state.answers.incomeRange !== "prefer_not_to_answer", // 2. Set a family budget — answered the income-range question with a real range, not just declined it
    state.savedCollegeIds.length > 0, // 3. Build a financially balanced college list
    stage4Tasks.every(id => state.completedTaskIds.includes(id)), // 4. Gather financial documents — fee waiver + the document checklist
    state.completedTaskIds.includes("t-fsaid-student") && state.completedTaskIds.includes("t-fsaid-parent"), // 5. Complete FAFSA
  ];
}
function currentStageIndex(){
  if (!state.onboardingComplete) return 1;
  const checks = stageCompletionChecks();
  for (let i = 0; i < checks.length; i++) {
    if (!checks[i]) return i + 1;
  }
  return checks.length + 1; // furthest verified stage — later stages aren't auto-tracked, see renderStageCard
}
function allTasksForRole(role){
  const generated = computeGeneratedItems().filter(i => i.type === "task" || i.type === "escalation");

  const all = generated.concat(base);
  return all.filter(t => t.assignedTo === role || t.assignedTo === "either");
}

/* Money-moving deadlines (FAFSA-adjacent state aid, scholarships) vs. pure
   admissions deadlines are a real distinction — missing the first costs you
   actual dollars; missing the second is a different kind of problem this
   app doesn't otherwise cover. Financial view is the default per the
   product's focus: how to pay for it, not how to get in. */
function renderDeadlines(){
  const es = state.lang === "es";
  const typeLabels = { Admissions: es?"Admisiones":"Admissions", "State financial aid": es?"Ayuda financiera estatal":"State financial aid", Scholarship: es?"Beca":"Scholarship" };
  const saved = state.savedCollegeIds.map(id => findCollege(id));
  let rows = [];
  saved.forEach(c => c.deadlines.forEach(d => rows.push({type:"Admissions", financial:false, who:c.name, label:d.label, date:d.date, status:d.status, sourceKey:d.sourceKey})));
  STATE_AID.forEach(g => rows.push({type:"State financial aid", financial:true, who:g.state, label:g.name + " — " + trField(g,"deadlineLabel"), date:g.date, status:g.status, sourceKey:g.sourceKey}));
  SCHOLARSHIPS.forEach(s => rows.push({type:"Scholarship", financial:true, who:s.name, label:(es?"Fecha límite de solicitud":"Application deadline") + (s.deadlineNote ? " (" + trField(s,"deadlineNote") + ")" : ""), date:s.deadline, status:s.status, sourceKey:s.sourceKey}));
  const filter = state.deadlineTypeFilter || "financial";
  const filtered = filter === "financial" ? rows.filter(r => r.financial) : filter === "admissions" ? rows.filter(r => !r.financial) : rows;
  filtered.sort((a,b) => new Date(a.date) - new Date(b.date));
  const tabs = [
    {key:"financial", label:(es?"Ayuda financiera y becas":"Financial aid & scholarships") + " (" + rows.filter(r=>r.financial).length + ")"},
    {key:"all", label:(es?"Todas":"All") + " (" + rows.length + ")"},
    {key:"admissions", label:(es?"Admisiones":"Admissions") + " (" + rows.filter(r=>!r.financial).length + ")"},
  ];
  return '\
    <div class="card">\
      <h2>' + (es?"Calendario de fechas límite":"Deadline calendar") + '</h2>\
      <p class="muted">' + (es ? 'Cada fecha límite que realmente mueve dinero — ayuda estatal y becas — más la fecha de admisión de cada universidad guardada como referencia. Perder una fecha límite financiera te puede costar dinero real, por eso esto muestra primero lo financiero por defecto. Trasfondo general sobre cómo funcionan las fechas límite de ayuda estatal: ' : 'Every deadline that actually moves money — state aid and scholarships — plus each saved college\'s admissions date for reference. Missing a financial deadline can cost you real dollars, which is why this defaults to money-first. General background on how state aid deadlines work: ') + guideLink("state-aid-basics", t("nav.guide")) + '.</p>\
      <div class="tabs" role="tablist" aria-label="Filter by deadline type">' + tabs.map(tb => '<button role="tab" aria-selected="' + (filter===tb.key) + '" data-deadline-filter="' + tb.key + '">' + esc(tb.label) + '</button>').join("") + '</div>\
      <table>\
        <thead><tr><th>' + (es?"Fecha":"Date") + '</th><th>' + (es?"Tipo":"Type") + '</th><th>' + (es?"Qué":"What") + '</th><th>' + (es?"Estado":"Status") + '</th><th></th></tr></thead>\
        <tbody>' + (filtered.length ? filtered.map(r => {
          const days = daysUntil(r.date); const dl = deadlineStatusLabel(days);
          const src = SOURCES[r.sourceKey];
          return '<tr><td>' + fmtDate(r.date) + '<div class="muted">' + (days>=0 ? (es ? "faltan " + days + " días" : days + " days away") : (es ? "hace " + Math.abs(days) + " días" : Math.abs(days) + " days ago")) + '</div><div style="margin-top:4px;">' + addToCalendarLink(r.who + " — " + r.label, r.date, "From Compass. Verify the current date directly before relying on it.") + '</div></td><td>' + esc(typeLabels[r.type] || r.type) + '</td><td><strong>' + esc(r.who) + '</strong><div class="muted">' + esc(r.label) + '</div></td><td>' + sourceBadge(r.status) + ' <span class="badge ' + dl.cls + '">' + dl.text + '</span></td><td style="white-space:nowrap;">' + sourceLinkButton(r.sourceKey, es?"Fuente →":"Source →") + '<div style="margin-top:6px;">' + whyButton(r.label, (es?"Obtenido de ":"Sourced from ") + (src?src.org:(es?"una nota interna":"an internal note")) + ".", r.sourceKey) + '</div></td></tr>';
        }).join("") : '<tr><td colspan="5" class="muted">' + (es ? "Aún no hay fechas límite en esta vista — " + (filter==="admissions" ? "guarda una universidad para ver sus fechas." : "guarda una universidad o vuelve más tarde cuando abran nuevos ciclos de becas.") : "No deadlines in this view yet — " + (filter==="admissions" ? 'save a college to see its dates.' : 'save a college or check back as new scholarship cycles open.')) + '</td></tr>') + '</tbody>\

function renderFafsa(){
  const ctx = ctxFromState();
  const es = state.lang === "es";
  const items = [
    { q:"When can I file the 2027–28 FAFSA?", qEs:"¿Cuándo puedo presentar la FAFSA 2027–28?",
      a:"The Dept. of Education has targeted an October 1, 2026 launch for the 2027–28 form — the cycle you'll use applying for Fall 2027 enrollment. Filing as close to that date as your documents allow is worth it: some aid (like FSEOG and your state grant) is limited and effectively first-come, first-served.",
      aEs:"El Departamento de Educación tiene como meta un lanzamiento el 1 de octubre de 2026 para el formulario 2027–28 — el ciclo que usarás al aplicar para la inscripción de otoño de 2027. Vale la pena presentar tan pronto como tus documentos lo permitan: alguna ayuda (como el FSEOG y tu subvención estatal) es limitada y funciona prácticamente por orden de llegada.",
      who:"both", sourceKey:"fafsaCycle" },
    { q:"How long does it actually take to fill out?", qEs:"¿Cuánto tiempo realmente toma llenarla?",
      a:"Most families finish in 30–60 minutes once every contributor has their documents ready — longer the first time, faster in future years since a lot can carry over. The single biggest time-saver is letting FAFSA pull your tax information directly from the IRS instead of typing it in by hand, when that option is offered.",
      aEs:"La mayoría de las familias terminan en 30–60 minutos una vez que cada contribuyente tiene sus documentos listos — más tiempo la primera vez, más rápido en años futuros ya que mucha información se puede trasladar. El mayor ahorro de tiempo es dejar que la FAFSA obtenga tu información fiscal directamente del IRS en lugar de escribirla a mano, cuando se ofrece esa opción.",
      who:"both" },
    { q:"What do I need before I sit down to start it?", qEs:"¿Qué necesito antes de sentarme a comenzarla?",
      a:"Your own Social Security number, your most recent federal tax return (or confirmation you didn't need to file), records of any untaxed income, current bank/investment balances, and the list of colleges you're applying to. See the document checklist on your Roadmap for the full breakdown by who needs to gather what.",
      aEs:"Tu propio número de Seguro Social, tu declaración de impuestos federal más reciente (o confirmación de que no necesitabas declarar), registros de cualquier ingreso no gravado, saldos actuales de banco/inversión, y la lista de universidades a las que estás aplicando. Consulta la lista de documentos en tu Plan para el desglose completo de quién necesita reunir qué.",
      who:"both" },
    { q:"What's the \"Student Aid Index\" (SAI)?", qEs:"¿Qué es el \"Índice de Ayuda Estudiantil\" (SAI)?",
      a:"It's the number FAFSA calculates from your answers that colleges use to figure out your aid eligibility — it replaced the older \"Expected Family Contribution\" (EFC) terminology a few years back. A lower SAI generally means more eligibility for need-based aid. It is not a bill and not what you'll actually pay; it's an eligibility number colleges plug into their own aid formulas, which also count non-need-based aid like merit scholarships.",
      aEs:"Es el número que la FAFSA calcula a partir de tus respuestas y que las universidades usan para determinar tu elegibilidad para ayuda — reemplazó la terminología anterior de \"Contribución Familiar Esperada\" (EFC) hace unos años. Un SAI más bajo generalmente significa más elegibilidad para ayuda basada en necesidad. No es una factura ni lo que realmente pagarás; es un número de elegibilidad que las universidades usan en sus propias fórmulas de ayuda, las cuales también cuentan ayuda no basada en necesidad, como las becas por mérito.",
      who:"both" },
    { q:"Who is the \"FAFSA parent\" if my parents are divorced or separated and live apart?", qEs:"¿Quién es el \"padre de la FAFSA\" si mis padres están divorciados o separados y viven aparte?",
      a:"Generally, the parent who provided more financial support to you over the past 12 months. If support was split evenly, it's usually the parent with greater income and assets. This is a federal rule — confirm it against the current official instructions when you actually fill out the form, since the exact wording can be updated.",
      aEs:"Generalmente, el padre que te proporcionó más apoyo financiero durante los últimos 12 meses. Si el apoyo fue dividido en partes iguales, usualmente es el padre con mayores ingresos y activos. Esta es una regla federal — confírmala con las instrucciones oficiales vigentes cuando realmente llenes el formulario, ya que el texto exacto puede actualizarse.",
      who:"parent", sourceKey:"fafsaCycle", show: ctx.householdStructure === "divorced_separated" },
    { q:"What if my other parent won't participate at all?", qEs:"¿Qué pasa si mi otro padre no quiere participar en absoluto?",
      a:"FAFSA itself generally only needs one parent's information in a divorced/separated household (the FAFSA parent above) — a refusing second parent doesn't block your FAFSA. UC and CSU campuses don't require anything more from a second parent. Some private colleges are different: if a saved college requires the CSS Profile, check its \"CSS Profile\" fact on My Colleges — colleges marked \"Required\" may also ask for noncustodial-parent information, usually with a waiver process if you have no contact with that parent.",
      aEs:"La FAFSA en sí generalmente solo necesita la información de un padre en un hogar divorciado/separado (el padre de la FAFSA de arriba) — un segundo padre que se niegue no bloquea tu FAFSA. Los campus de UC y CSU no requieren nada más de un segundo padre. Algunas universidades privadas son diferentes: si una universidad guardada requiere el CSS Profile, revisa su dato de \"CSS Profile\" en Mis Universidades — las universidades marcadas como \"Requerido\" también pueden pedir información del padre sin custodia, usualmente con un proceso de exención si no tienes contacto con ese padre.",
      who:"student", show: ctx.householdStructure === "divorced_separated" },
    { q:"What does \"contributor\" mean?", qEs:"¿Qué significa \"contribuyente\"?",
      a:"Anyone required to provide information on your FAFSA — you, and generally one parent (or a stepparent, depending on circumstances) — is a \"contributor.\" Each contributor needs their own StudentAid.gov account and must provide consent and approval directly; you cannot enter their information for them. The FAFSA can't be submitted until every contributor finishes their own section, so don't wait to send that invitation.",
      aEs:"Cualquier persona que deba proporcionar información en tu FAFSA — tú, y generalmente un padre (o padrastro/madrastra, según las circunstancias) — es un \"contribuyente\". Cada contribuyente necesita su propia cuenta en StudentAid.gov y debe dar su consentimiento y aprobación directamente; no puedes ingresar su información por ellos. La FAFSA no se puede enviar hasta que cada contribuyente termine su propia sección, así que no esperes para enviar esa invitación.",
      who:"both" },
    { q:"Do I have to file it again every year?", qEs:"¿Tengo que presentarla de nuevo cada año?",
      a:"Yes — FAFSA covers one academic year at a time, so it's a yearly task for as long as you're seeking federal or state aid. Good news: renewal is usually faster than your first time, since some information carries over and you already know the process.",
      aEs:"Sí — la FAFSA cubre un año académico a la vez, así que es una tarea anual mientras busques ayuda federal o estatal. Buenas noticias: la renovación usualmente es más rápida que tu primera vez, ya que parte de la información se traslada y ya conoces el proceso.",
      who:"both" },
    { q:"What happens right after I submit?", qEs:"¿Qué pasa justo después de enviarla?",
      a:"You'll get a summary (sometimes called a Student Aid Report) showing your SAI and a rough estimate of what you're eligible for. Every college you listed receives your FAFSA information directly and uses it to build your actual aid offer — that offer, not the FAFSA summary itself, is the real number to look at once it arrives.",
      aEs:"Recibirás un resumen (a veces llamado Reporte de Ayuda Estudiantil) que muestra tu SAI y un estimado aproximado de para qué eres elegible. Cada universidad que enlistaste recibe tu información de la FAFSA directamente y la usa para construir tu oferta de ayuda real — esa oferta, no el resumen de la FAFSA en sí, es el número real que debes ver cuando llegue.",
      who:"both" },
    { q:"I made a mistake — can I fix it after submitting?", qEs:"Cometí un error — ¿puedo corregirlo después de enviarla?",
      a:"Yes, corrections are normal and expected, not a problem. Log back into your StudentAid.gov account, find your submitted FAFSA, and there's a correction option. Fix it as soon as you notice — colleges build offers off what's on file, so an error left uncorrected can affect your actual aid.",
      aEs:"Sí, las correcciones son normales y esperadas, no un problema. Inicia sesión de nuevo en tu cuenta de StudentAid.gov, encuentra tu FAFSA enviada, y hay una opción de corrección. Corrígelo tan pronto como lo notes — las universidades construyen sus ofertas con lo que está en el archivo, así que un error sin corregir puede afectar tu ayuda real.",
      who:"both" },
    { q:"Our income this year doesn't look like what's on last year's tax return — job loss, a big medical bill, something like that. What do we do?",
      qEs:"Nuestro ingreso este año no se parece al de la declaración de impuestos del año pasado — pérdida de empleo, una factura médica grande, algo así. ¿Qué hacemos?",
      a:"FAFSA itself only asks about the tax year on the form, but every college's financial aid office can consider a documented \"special circumstances\" or \"professional judgment\" appeal for a real, significant change since then. This isn't something FAFSA processes automatically — it's a direct conversation with each college's aid office, with documentation (a layoff letter, medical bills, etc.). See " + guideLink("appeals-basics", "the Guide's appeals overview") + " for more.",
      aEs:"La FAFSA en sí solo pregunta sobre el año fiscal en el formulario, pero la oficina de ayuda financiera de cada universidad puede considerar una apelación documentada de \"circunstancias especiales\" o \"juicio profesional\" por un cambio real y significativo desde entonces. Esto no es algo que la FAFSA procese automáticamente — es una conversación directa con la oficina de ayuda de cada universidad, con documentación (una carta de despido, facturas médicas, etc.). Consulta " + guideLink("appeals-basics", "el resumen de apelaciones de la Guía") + " para más información.",
      who:"parent" },
    { q:"My parent doesn't have a Social Security number. Can I still file FAFSA?", qEs:"Mi padre/madre no tiene número de Seguro Social. ¿Aún puedo presentar la FAFSA?",
      a:"Yes. A parent contributor without an SSN can still create a StudentAid.gov account and complete their section — the account-creation process has a path for this specifically. It looks a little different from the standard sign-up, so budget extra time for it and don't assume it's not possible just because the usual steps mention an SSN.",
      aEs:"Sí. Un padre contribuyente sin un número de Seguro Social todavía puede crear una cuenta en StudentAid.gov y completar su sección — el proceso de creación de cuenta tiene una ruta específicamente para esto. Se ve un poco diferente al registro estándar, así que reserva tiempo extra para ello y no asumas que no es posible solo porque los pasos usuales mencionan un número de Seguro Social.",
      who:"parent" },
  ];
  return '\
    <div class="card">\
      <h2>' + (es ? "Complemento del formulario FAFSA" : "FAFSA form companion") + '</h2>\
      <p class="muted">' + (es ? "Respuestas en lenguaje sencillo a las preguntas de la FAFSA que realmente aplican a tu situación — no es el formulario completo, ni un reemplazo de él. Nunca te pedimos tu contraseña de StudentAid.gov aquí, y nunca enviamos nada en tu nombre. Para el trasfondo general de \"qué es la FAFSA\", consulta " : "Plain-language answers to the FAFSA questions that actually apply to your situation — not the full form, and not a replacement for it. We never ask for your StudentAid.gov password here, and we never submit anything on your behalf. For the general \"what is FAFSA\" background, see ") + guideLink("fafsa-basics", t("nav.guide")) + '.</p>\
      <a class="btn" href="' + FAFSA_DIRECT_URL + '" target="_blank" rel="noopener" style="margin-top:4px;">' + (es ? "Presenta tu FAFSA en studentaid.gov →" : "File your FAFSA at studentaid.gov →") + '</a>\
      ' + items.filter(i => i.show === undefined || i.show).map(i => {
        const whoMeta = FAFSA_WHO_META[i.who];
        const whoLabel = es ? whoMeta.es : whoMeta.en;
        return '\
        <div style="border-top:1px solid var(--line); padding:14px 0;">\
          <h3>' + esc(es ? i.qEs : i.q) + '</h3>\
          <p>' + (es ? i.aEs : i.a) + '</p>\
          <div class="task-meta"><span class="badge role-' + whoMeta.cls + '">' + esc(whoLabel) + '</span>' + (i.sourceKey ? whyButton(i.q, es ? "Consulta la fuente para la regla oficial vigente." : "See the source for the current official rule.", i.sourceKey) : '') + '</div>\
        </div>';
      }).join("") + '\
    </div>\
    <div class="card">\
      <h2>' + (es ? "Si eres un estudiante indocumentado" : "If you\'re an undocumented student") + '</h2>\
      <p>' + (es ? 'Los estudiantes indocumentados no son elegibles para presentar la FAFSA federal — pero en California, tienes una ruta real hacia la ayuda financiera estatal a través de la <strong>Solicitud de la Ley del Sueño de California (CADAA)</strong>, un formulario separado creado específicamente para esto. No es una versión más pequeña o menor de la FAFSA — abre la puerta a Cal Grants, subvenciones estatales y universitarias, exenciones de cuotas de colegios comunitarios, y muchas becas privadas, y también te califica para matrícula estatal en universidades públicas de California bajo AB 540.' : 'Undocumented students are not eligible to file the federal FAFSA — but in California, you have a real path to state financial aid through the <strong>California Dream Act Application (CADAA)</strong>, a separate form built specifically for this. It is not a smaller or lesser version of FAFSA — it opens the door to Cal Grants, state and university grants, community college fee waivers, and many private scholarships, and it also qualifies you for in-state tuition at California public colleges under AB 540.') + '</p>\
      <div class="fact-grid" style="margin:14px 0;">\
        <div class="fact"><div class="fact-label">' + (es ? "🔒 Privacidad" : "🔒 Privacy") + '</div><div class="fact-value" style="font-size:13px; font-weight:600;">' + (es ? "CSAC declara directamente que la información de la CADAA nunca se comparte con ninguna agencia federal — se usa solo para determinar tu elegibilidad para ayuda estatal y universitaria." : "CSAC states directly that CADAA information is never shared with any federal agency — it\'s used only to determine your state and college aid eligibility.") + '</div></div>\
        <div class="fact"><div class="fact-label">' + (es ? "🪪 Lo que necesitas" : "🪪 What you need") + '</div><div class="fact-value" style="font-size:13px; font-weight:600;">' + (es ? "No se requiere número de Seguro Social ni estatus DACA — la elegibilidad funciona a través de la exención de matrícula para no residentes AB 540 de California." : "No Social Security number and no DACA status required — eligibility runs through California\'s AB 540 nonresident-tuition exemption instead.") + '</div></div>\
        <div class="fact"><div class="fact-label">' + (es ? "📅 Fecha límite" : "📅 Deadline") + '</div><div class="fact-value" style="font-size:13px; font-weight:600;">' + (es ? "La misma fecha límite prioritaria del 2 de marzo que el Cal Grant, ya que la CADAA es lo que desbloquea la elegibilidad del Cal Grant para estudiantes indocumentados." : "Same March 2 priority deadline as the Cal Grant, since CADAA is what unlocks Cal Grant eligibility for undocumented students.") + '</div></div>\
      </div>\
      <a class="btn" href="' + CADAA_DIRECT_URL + '" target="_blank" rel="noopener">' + (es ? "Presenta tu CADAA en dream.csac.ca.gov →" : "File your CADAA at dream.csac.ca.gov →") + '</a>\
      <p class="muted" style="margin-top:12px;">' + (es ? 'Si eres una familia de estatus mixto — por ejemplo, un padre indocumentado pero un estudiante que es ciudadano estadounidense o no ciudadano elegible — el estudiante generalmente presenta la FAFSA regular, no la CADAA (consulta "Mi padre/madre no tiene número de Seguro Social" arriba). Si no estás seguro(a) de cuál aplica para ti, la línea de apoyo de la Comisión de Ayuda Estudiantil de California (1-888-224-7268) puede decírtelo directamente, y <button class="why-btn" data-route="help">Ayuda</button> tiene orientación sobre cuándo una situación como esta vale la pena para una conversación real con tu consejero(a) escolar. ' : 'If you\'re a mixed-status family — for example, an undocumented parent but a student who is a U.S. citizen or eligible noncitizen — the student generally files the regular FAFSA, not CADAA (see "My parent doesn\'t have a Social Security number" above). If you\'re unsure which applies to you, the California Student Aid Commission\'s support line (1-888-224-7268) can tell you directly, and <button class="why-btn" data-route="help">Help</button> has guidance on when a situation like this is worth a real conversation with your school counselor. ') + whyButton("California Dream Act Application (CADAA)", es ? "La propia página de elegibilidad de la Comisión de Ayuda Estudiantil de California para la CADAA." : "The California Student Aid Commission\'s own eligibility page for CADAA.", "cadaaEligibility") + '</p>\
    </div>';
}

        <div class="fact"><div class="fact-label">' + t("govaid.whoItsFor") + '</div><div class="fact-value" style="font-size:13px; font-weight:600;">' + esc(trField(g,"eligibility")) + '</div></div>\

/* ---- Scholarships ---- */
function scholarshipRow(s){
  const days = daysUntil(s.deadline); const dl = deadlineStatusLabel(days);
  const tags = (s.identityTags && s.identityTags.length) ? '<div style="margin-top:4px;">' + s.identityTags.map(tag => '<span class="badge plain" style="margin-right:4px;">' + esc(identityLabel(tag)) + '</span>').join("") + '</div>' : "";
  return '<tr><td><strong>' + esc(s.name) + '</strong>' + tags + '</td><td>' + esc(trField(s,"amount")) + '</td><td>' + fmtDate(s.deadline) + (s.deadlineNote ? '<div class="muted">' + esc(trField(s,"deadlineNote")) + '</div>' : '') + '<div>' + sourceBadge(s.status) + ' <span class="badge ' + dl.cls + '">' + dl.text + '</span></div><div style="margin-top:4px;">' + addToCalendarLink(s.name + " deadline", s.deadline, s.deadlineNote || "") + '</div></td><td class="muted">' + esc(trField(s,"eligibility")) + '</td><td style="white-space:nowrap;">' + sourceLinkButton(s.sourceKey, t("scholarships.apply")) + '<div style="margin-top:6px;">' + whyButton(s.name, t("scholarships.whyExplanation"), s.sourceKey) + '</div></td></tr>';
}

        <a class="btn secondary" href="https://bigfuture.collegeboard.org/scholarship-search" target="_blank" rel="noopener" style="justify-content:center;">BigFuture (College Board) →</a>\
        <a class="btn secondary" href="https://www.fastweb.com/college-scholarships" target="_blank" rel="noopener" style="justify-content:center;">Fastweb →</a>\

      </div>\
      <p class="muted" style="margin-top:12px;">' + t("scholarships.freeToUse") + guideLink("scholarships-basics", t("nav.guide")) + t("scholarships.freeToUse.post") + '</p>\
    </div>';
}

/* ---- Offers & Affordability ---- */
function renderOffers(){
  const es = state.lang === "es";
  const pending = state.pendingOfferParse;
  let pendingCollegeId = "";
  if (pending && pending.college) {
    const lower = String(pending.college).toLowerCase();
    for (const id of state.savedCollegeIds) {
      const c = findCollege(id);
      if (c && (c.name.toLowerCase().includes(lower) || lower.includes(c.name.toLowerCase()))) { pendingCollegeId = c.id; break; }
    }
  }
  const collegeOptions = state.savedCollegeIds.map(id => { const c = findCollege(id); return c ? '<option value="' + c.id + '"' + (c.id === pendingCollegeId ? ' selected' : '') + '>' + esc(c.name) + '</option>' : ""; }).join("");
  const numVal = (v) => (v === null || v === undefined ? "" : v);
  return '\
    <div class="card">\
      <h2>' + (es?"Lo que esta herramienta realmente hace":"What this tool actually does") + '</h2>\
      <p>' + (es ? 'Las cartas de oferta llegan entre enero y abril, y cada universidad las formatea de manera diferente. Esto extrae los mismos números principales de cada una y alinea a las universidades una al lado de la otra, para que lo que realmente pagarías sea fácil de ver.' : 'Award letters arrive January–April, and every college formats them differently. This pulls the same core numbers from each one and lines colleges up side by side, so what you\'d really pay is easy to see.') + '</p>\
