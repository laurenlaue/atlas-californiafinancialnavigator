/* Federal fixed rates for loans first disbursed July 1, 2026 – June 30,
   2027 (see the Guide's loans article / loanRates2627 source). Standard
   10-year term is the federal default repayment plan — not the only
   option (income-driven plans exist), but the right baseline estimate. */
const LOAN_RATES = { undergrad: 0.0652, parentPlus: 0.0907 };
const LOAN_TERM_YEARS = 10;
function monthlyLoanPayment(principal, annualRate, years){
  if (!principal) return 0;
  const r = annualRate / 12, n = years * 12;
  return principal * r / (1 - Math.pow(1 + r, -n));
}
function loanRepaymentEstimate(principal, annualRate, years){
  const monthly = monthlyLoanPayment(principal, annualRate, years);
  const totalPaid = monthly * years * 12;
  return { monthly, totalPaid, totalInterest: totalPaid - principal };
}

const FOUR_YEAR_ANNUAL_INCREASE = 0.03; // conservative, general planning assumption — not a published UC figure
function fourYearProjection(o, giftAid){
  // UC's systemwide Tuition Stability Plan holds tuition & fees flat for a
  // student's entering cohort, but this form only collects one total COA
  // figure (not a tuition/living-cost split), so this estimates the whole
  // total growing at a conservative, clearly-labeled rate instead of
  // pretending to split out what's actually frozen. Gift aid is assumed to
  // renew at the same dollar amount each year — a real assumption, not a
  // guarantee, and it's called out below.
  let totalCoa = 0, totalGiftAid = 0;
  for (let year = 0; year < 4; year++) {
    totalCoa += o.coa * Math.pow(1 + FOUR_YEAR_ANNUAL_INCREASE, year);
    totalGiftAid += giftAid;
  }
  return { totalCoa: Math.round(totalCoa), totalGiftAid: Math.round(totalGiftAid), totalNet: Math.round(totalCoa - totalGiftAid) };
}
function renderOfferComparison(){
  const es = state.lang === "es";
  const rows = state.offers.map(o => {
    const college = findCollege(o.college);
    const giftAid = o.grants + o.scholarships;
    const borrowed = o.loans + o.parentPlus;
    const netPrice = o.coa - giftAid;
    const gap = netPrice - o.workStudy - borrowed;
    const fourYear = fourYearProjection(o, giftAid);
    const studentLoanEst = loanRepaymentEstimate(o.loans, LOAN_RATES.undergrad, LOAN_TERM_YEARS);
    const plusLoanEst = loanRepaymentEstimate(o.parentPlus, LOAN_RATES.parentPlus, LOAN_TERM_YEARS);
    const totalMonthly = studentLoanEst.monthly + plusLoanEst.monthly;
    const totalInterest = studentLoanEst.totalInterest + plusLoanEst.totalInterest;
    const totalRepaid = studentLoanEst.totalPaid + plusLoanEst.totalPaid;
    const warnings = [];
    if (o.parentPlus > 0) warnings.push(es ? "Los préstamos Parent PLUS / privados son deuda, no ayuda regalada — no los leas como si redujeran tu costo real de la forma en que lo hace una subvención." : "Parent PLUS / private loans are debt, not gift aid — don't read them as reducing your real cost the way a grant does.");
    if (o.workStudy > 0.15 * o.coa) warnings.push(es ? "El estudio-trabajo se gana durante el año, no es efectivo disponible el primer día — no cuentes con él para cubrir la primera factura." : "Work-study is earned over the year, not cash available on day one — don't count on it to cover the first bill.");
    if (gap > 5000) warnings.push(es ? "Hay una brecha significativa sin explicar entre el costo total y todo lo cubierto — llama a la oficina de ayuda financiera y pregunta directamente qué la cubre." : "There's a meaningful unexplained gap between total cost and everything covered — call the financial aid office and ask directly what covers it.");
    return { college, o, giftAid, borrowed, netPrice, gap, fourYear, totalMonthly, totalInterest, totalRepaid, warnings };
  });
  return '\
    <div class="card">\
      <h2>' + (es?"Comparación":"Comparison") + '</h2>\
      <table>\
        <thead><tr><th>' + (es?"Universidad":"College") + '</th><th>' + (es?"Costo de asistencia":"Cost of attendance") + '</th><th>' + (es?"Ayuda regalada (subvenciones+becas)":"Gift aid (grants+scholarships)") + '</th><th>' + (es?"Precio neto (año 1)":"Net price (year 1)") + '</th><th>' + (es?"Estudio-trabajo":"Work-study") + '</th><th>' + (es?"Prestado (préstamos)":"Borrowed (loans)") + '</th><th>' + (es?"Brecha restante":"Remaining gap") + '</th><th></th></tr></thead>\
        <tbody>' + rows.map(r => '\
          <tr>\
            <td><strong>' + esc(r.college ? r.college.name : r.o.college) + '</strong>' + (r.warnings.length ? r.warnings.map(w=>'<div class="muted" style="color:var(--warn);">⚠️ ' + esc(w) + '</div>').join("") : "") + '</td>\
            <td>$' + r.o.coa.toLocaleString() + '</td>\

          </tr>').join("") + '</tbody>\
      </table>\
    </div>\
    ' + (rows.some(r => r.o.loans > 0 || r.o.parentPlus > 0) ? '\
    <div class="card">\
      <h2>' + (es?"Cómo se ve realmente pagar esos préstamos":"What repaying those loans actually looks like") + '</h2>\
      <p class="muted">' + (es ? 'Repago federal estándar a 10 años, a las tasas fijas reales para préstamos desembolsados por primera vez del 1 de julio de 2026 al 30 de junio de 2027: ' : 'Standard 10-year federal repayment, at the actual fixed rates for loans first disbursed July 1, 2026 – June 30, 2027: ') + (LOAN_RATES.undergrad*100).toFixed(2) + (es ? '% para préstamos Direct estudiantiles, ' : '% for student Direct loans, ') + (LOAN_RATES.parentPlus*100).toFixed(2) + (es ? '% para Parent PLUS. ' : '% for Parent PLUS. ') + whyButton("Federal loan interest rates 2026-27", es ? "Las tasas fijas que el gobierno federal publica para préstamos desembolsados por primera vez en este ciclo." : "The fixed rates the federal government publishes for loans first disbursed in this cycle.", "loanRates2627") + (es ? ' Existen planes basados en ingresos que pueden reducir el número mensual — este es el punto de referencia del plan estándar, no tu única opción.' : ' Income-driven plans exist and may lower the monthly number — this is the standard-plan baseline, not your only option.') + '</p>\

        <tbody>' + rows.filter(r => r.o.loans > 0 || r.o.parentPlus > 0).map(r => '\
          <tr>\
            <td><strong>' + esc(r.college ? r.college.name : r.o.college) + '</strong></td>\
            <td>$' + r.borrowed.toLocaleString() + '</td>\
            <td><strong>$' + Math.round(r.totalMonthly).toLocaleString() + (es?'/mes':'/mo') + '</strong></td>\
            <td>$' + Math.round(r.totalInterest).toLocaleString() + '</td>\
            <td>$' + Math.round(r.totalRepaid).toLocaleString() + '</td>\
          </tr>').join("") + '</tbody>\
      </table>\
      <p class="muted" style="margin-top:10px;">' + (es ? 'Cada dólar en la columna de "total repagado" más allá de lo que pediste prestado es interés — dinero que el préstamo te cuesta por el privilegio de pagar con el tiempo, además del costo de asistencia en sí. Trasfondo general: ' : 'Every dollar in the "total repaid" column beyond what you borrowed is interest — money the loan costs you for the privilege of paying over time, on top of the cost of attendance itself. General background: ') + guideLink("loans-basics", es ? "el artículo de préstamos de la Guía" : "the Guide\'s loans article") + '.</p>\

}

/* Real cross-device sharing here means "text or paste this to the other
   person," not live sync — this app deliberately has no accounts or
   server (see PERSISTENCE), so a parent's phone and a student's laptop
   never talk to each other directly. This is the honest version of that:
   an actually copy/paste-ready summary, not a placeholder saying one
   could exist. */
function buildFamilySummaryText(){
  const current = currentStageIndex();
  const stageName = STAGES[current-1];
  const studentNext = allTasksForRole("student").filter(t => !state.completedTaskIds.includes(t.id)).slice(0,3);
  const parentNext = allTasksForRole("parent").filter(t => !state.completedTaskIds.includes(t.id)).slice(0,3);
  const saved = state.savedCollegeIds.map(id => findCollege(id)).filter(Boolean);
  const upcoming = [];
  saved.forEach(c => c.deadlines.forEach(d => { const days = daysUntil(d.date); if (days >= 0 && days <= 45) upcoming.push({ label: c.name + " — " + d.label, date: d.date, days }); }));
  STATE_AID.forEach(g => { const days = daysUntil(g.date); if (days >= 0 && days <= 45) upcoming.push({ label: g.name, date: g.date, days }); });
  upcoming.sort((a,b) => a.days - b.days);
  const lines = [];
  lines.push("Compass roadmap summary — " + fmtDate(new Date().toISOString().slice(0,10)));
  lines.push("");
  lines.push("Where we are: Step " + current + " of " + STAGES.length + " — " + stageName);
  lines.push("");
  lines.push("Student's next steps:");
  lines.push(studentNext.length ? studentNext.map(t => "- " + t.title).join("\n") : "- Nothing pending right now");
  lines.push("");
  lines.push("Parent's next steps:");
  lines.push(parentNext.length ? parentNext.map(t => "- " + t.title).join("\n") : "- Nothing pending right now");
  if (upcoming.length) {
    lines.push("");
    lines.push("Deadlines in the next 45 days:");
    lines.push(upcoming.map(u => "- " + fmtDate(u.date) + " (" + u.days + " days): " + u.label).join("\n"));
  }
  if (saved.length) {
    lines.push("");
    lines.push("Colleges on the list: " + saved.map(c => c.name).join(", "));
  }
  lines.push("");
  lines.push("From Compass — a free financial-aid roadmap. No account, nothing sent anywhere.");
  return lines.join("\n");
}

function loadAnalytics(){
  if (!GA_MEASUREMENT_ID || GA_MEASUREMENT_ID.indexOf("XXXX") >= 0) {
    console.info("[Compass] Analytics consent accepted, but no real GA4 property ID is configured yet — skipping script injection.");
    return;
  }
  const s1 = document.createElement("script");
  s1.async = true;
  s1.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_MEASUREMENT_ID;
  document.head.appendChild(s1);
  window.dataLayer = window.dataLayer || [];
  function gtag(){ window.dataLayer.push(arguments); }
  gtag("js", new Date());
  gtag("config", GA_MEASUREMENT_ID, { anonymize_ip: true });
}
function renderConsentBanner(){
  const es = state.lang === "es";
  if (es) return '\
    <div class="consent-banner" role="dialog" aria-label="Consentimiento de privacidad y análisis">\
      <p>Nos gustaría usar Google Analytics para ver el uso anonimizado y agregado de este sitio (qué páginas se usan, aproximadamente cuántos visitantes) — nunca tu nombre, detalles financieros, o nada de lo que escribes en tu plan. Consulta nuestra <a href="#" data-route="privacy">Política de Privacidad</a>.</p>\
      <div class="actions">\
        <button class="btn secondary small" id="consent-decline">Rechazar</button>\
        <button class="btn small" id="consent-accept">Aceptar</button>\
      </div>\
    </div>';
  return '\
    <div class="consent-banner" role="dialog" aria-label="Privacy and analytics consent">\
      <p>We\'d like to use Google Analytics to see anonymized, aggregate usage of this site (which pages get used, roughly how many visitors) — never your name, financial details, or anything you type into your roadmap. See our <a href="#" data-route="privacy">Privacy Policy</a>.</p>\
      <div class="actions">\
        <button class="btn secondary small" id="consent-decline">Decline</button>\
        <button class="btn small" id="consent-accept">Accept</button>\
      </div>\
    </div>';
}
function attachConsentHandlers(){
  const accept = document.getElementById("consent-accept");
  const decline = document.getElementById("consent-decline");
  if (accept) accept.addEventListener("click", () => { state.privacyConsent = "accepted"; loadAnalytics(); render(); });
  if (decline) decline.addEventListener("click", () => { state.privacyConsent = "declined"; render(); });
  document.querySelectorAll("#consent-root [data-route]").forEach(link => {
    link.addEventListener("click", (e) => {
      e.preventDefault();
      // Leave the consent choice untouched — just navigate so the policy
      // is reachable from inside the banner without accepting/declining first.
      state.route = "privacy";
      render();
    });
  });
}

/* ---- Why modal ---- */
function renderWhyModal(){
  const es = state.lang === "es";
  const w = state.activeWhy;
  const src = w.sourceKey ? SOURCES[w.sourceKey] : null;
  return '\
    <div class="modal-backdrop" id="why-backdrop">\
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="why-title">\
        <h3 id="why-title">' + (es?"¿Por qué veo esto?":"Why am I seeing this?") + '</h3>\
        <dl>\
          <dt>' + (es?"Elemento":"Item") + '</dt><dd>' + esc(w.title) + '</dd>\
          <dt>' + (es?"Porque":"Because") + '</dt><dd>' + esc(w.explanation) + '</dd>\
          ' + (src ? '<dt>' + (es?"Fuente":"Source") + '</dt><dd>' + esc(src.title) + ' — ' + esc(src.org) + '<br/><a href="' + src.url + '" target="_blank" rel="noopener">' + src.url + '</a></dd><dt>' + (es?"Verificado":"Checked") + '</dt><dd>' + esc(src.checked) + '</dd>' : '<dt>' + (es?"Fuente":"Source") + '</dt><dd>' + (es?"Lógica interna basada en tus respuestas — no está vinculada a una fuente externa para este elemento.":"Internal logic based on your answers — not tied to an external source for this item.") + '</dd>') + '\
        </dl>\
        <div style="margin-top:16px; text-align:right;"><button class="btn secondary" id="why-close">' + (es?"Cerrar":"Close") + '</button></div>\
      </div>\
    </div>';
}
function attachModalHandlers(){
  const close = document.getElementById("why-close");
  const backdrop = document.getElementById("why-backdrop");
  if (close) close.addEventListener("click", () => { state.activeWhy = null; render(); });
  if (backdrop) backdrop.addEventListener("click", (e) => { if (e.target === backdrop) { state.activeWhy = null; render(); } });
}

/* ---- Save / resume modal ---- */
function renderSaveModal(){
  const es = state.lang === "es";
  const code = encodeState();
  if (es) return '\
    <div class="modal-backdrop" id="save-backdrop">\
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="save-title">\
        <h3 id="save-title">⇄ Código de exportación / transferencia</h3>\
        <p class="muted">Tu progreso ya se guarda automáticamente en este dispositivo — no necesitas esto para seguir trabajando aquí. Este código sirve para mover tu plan a otro navegador o dispositivo, o para tener tu propia copia de respaldo: todo tu plan (respuestas, universidades guardadas, tareas completadas, ofertas), empaquetado en texto. Nada se envía a ningún lado. Cópialo en un lugar seguro (app de notas, envíatelo por correo), y luego pégalo de vuelta desde la pantalla de bienvenida.</p>\
        <textarea readonly id="save-code" style="width:100%; min-height:90px; font-family:monospace; font-size:12px; padding:10px; border:1px solid var(--line); border-radius:8px; resize:vertical;">' + esc(code) + '</textarea>\
        <p id="save-copied" class="muted" style="color:var(--brand-dark); display:none; margin-top:6px;">Copiado a tu portapapeles.</p>\
        <div style="margin-top:16px; display:flex; justify-content:flex-end; gap:8px;">\
          <button class="btn secondary" id="save-copy">Copiar código</button>\
          <button class="btn ghost" id="save-close">Cerrar</button>\
        </div>\
      </div>\
    </div>';
  return '\
    <div class="modal-backdrop" id="save-backdrop">\
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="save-title">\
        <h3 id="save-title">⇄ Export / transfer code</h3>\
        <p class="muted">Your progress already autosaves on this device — you don\'t need this to keep working here. This code is for moving your roadmap to a different browser or device, or keeping your own backup: your whole roadmap (answers, saved colleges, completed tasks, offers), packed into text. Nothing is sent anywhere. Copy it somewhere safe (notes app, email to yourself), then paste it back in from the welcome screen.</p>\
        <textarea readonly id="save-code" style="width:100%; min-height:90px; font-family:monospace; font-size:12px; padding:10px; border:1px solid var(--line); border-radius:8px; resize:vertical;">' + esc(code) + '</textarea>\
        <p id="save-copied" class="muted" style="color:var(--brand-dark); display:none; margin-top:6px;">Copied to your clipboard.</p>\
        <div style="margin-top:16px; display:flex; justify-content:flex-end; gap:8px;">\
          <button class="btn secondary" id="save-copy">Copy code</button>\
          <button class="btn ghost" id="save-close">Close</button>\
        </div>\
      </div>\
    </div>';
}
function attachSaveModalHandlers(){
  const close = document.getElementById("save-close");
  const backdrop = document.getElementById("save-backdrop");
  const copyBtn = document.getElementById("save-copy");
  const textarea = document.getElementById("save-code");
  if (close) close.addEventListener("click", () => { state.showSaveModal = false; render(); });
  if (backdrop) backdrop.addEventListener("click", (e) => { if (e.target === backdrop) { state.showSaveModal = false; render(); } });
  if (copyBtn) copyBtn.addEventListener("click", () => {
    const done = () => { const msg = document.getElementById("save-copied"); if (msg) msg.style.display = "block"; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(textarea.value).then(done).catch(() => { textarea.select(); document.execCommand("copy"); done(); });
    } else {
      textarea.select();
      document.execCommand("copy");
      done();
    }
  });
}

const disclaimerPrivacyLink = document.getElementById("disclaimer-privacy-link");
if (disclaimerPrivacyLink) {
  disclaimerPrivacyLink.addEventListener("click", (e) => {
    e.preventDefault();
    state.route = "privacy";
    if (!state.onboardingComplete) { state.onboardingComplete = true; state.role = state.role || "student"; }
    render();
  });
}

/* ---- Startup: hydrate from local storage, then let a bookmarked/shared
   URL hash (if present and valid) pick the initial screen. ---- */
loadFromStorage();
if (state.privacyConsent === "accepted") loadAnalytics();
const startHash = location.hash ? location.hash.slice(1) : "";
if (state.onboardingComplete && VALID_HASH_ROUTES.indexOf(startHash) >= 0) {
  state.route = startHash;
}

render();
</script>
