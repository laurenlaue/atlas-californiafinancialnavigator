const GUIDE_ARTICLES = [
  { id:"fafsa-basics", title:"FAFSA, in plain language",
    body:[
      "FAFSA (Free Application for Federal Student Aid) is the form nearly every college and the federal government uses to figure out what your family can afford and what aid you qualify for. It's free — anyone asking you to pay to file it is not legitimate.",
      "You'll need a StudentAid.gov account, and generally so will one parent (called a \"contributor\") if you're a dependent student. Each contributor creates their own account and enters their own information directly — you can't do it for them.",
      "FAFSA primarily uses tax information (often pulled automatically from the IRS) plus some questions about assets and household size. It determines your eligibility for federal grants, loans, and work-study, and most colleges also use it for their own aid.",
      "The 2027–28 FAFSA — the cycle a student applying for Fall 2027 enrollment will use — is targeted to launch October 1, 2026.",
    ],
    sourceKey:"fafsaCycle" },
  { id:"state-aid-basics", title:"State financial aid, generally",
    body:[
      "Most states run their own grant programs on top of federal aid, usually funded by the state government and only available to residents attending eligible in-state (sometimes any) colleges.",
      "These almost always have their own deadline, separate from any college's admissions deadline — and it's often earlier than you'd expect, sometimes tied to the FAFSA priority filing date rather than any specific college's calendar.",
      "Many state programs are first-come, first-served or have limited funding even for otherwise-eligible students, which is why filing early — not just before the deadline — genuinely matters more here than for most other aid.",
      "This prototype has real, sourced data for one state program (California's Cal Grant) — see My Colleges / Deadlines for the specifics if that applies to you; otherwise, search \"[your state] state grant deadline\" and confirm directly with your state's higher-education agency.",
    ],
    sourceKey:"calGrantDates" },
  { id:"scholarships-basics", title:"Outside scholarships: what's worth your time",
    body:[
      "\"Outside\" or \"private\" scholarships are ones you apply for directly from an organization — a company, foundation, or nonprofit — rather than through a college. They're not part of FAFSA or CSS Profile at all.",
      "Focus on effort-to-reward: a handful of larger, well-matched scholarships you have a real shot at usually beats dozens of $500 raffles. Watch for real eligibility fit (state, major, background, income) rather than applying everywhere generically.",
      "Legitimate scholarships never charge an application fee and never guarantee you'll win. If something asks for payment or feels too good to be true, it probably is.",
      "One thing families are often surprised by: winning an outside scholarship can sometimes reduce a college's own need-based grant (\"displacement\") — ask each college directly how they handle outside awards once you have one.",
    ],
    sourceKey:null },
  { id:"offers-basics", title:"Reading a financial aid offer",
    body:[
      "An aid offer (sometimes called an \"award letter\") lists the total cost of attendance and how it proposes to cover it: gift aid (grants and scholarships — money you don't repay), work-study (money you earn, not cash upfront), and loans (money you or a parent borrow and must repay, sometimes with interest).",
      "The single most useful number to calculate yourself is: cost of attendance minus gift aid only. That's your real net price before considering loans or work — loans are debt, not a discount, no matter how an offer's layout presents them.",
      "Offers use wildly inconsistent formats between colleges — some bury loans under vague labels, some omit indirect costs like housing or travel. Comparing the same categories side by side (this prototype's Offers tab does this automatically) matters more than trusting any single college's own total.",
      "If numbers don't add up to the full cost of attendance, that's a real gap you'll be expected to cover some other way — ask the financial aid office directly what they expect to fill it.",
    ],
    sourceKey:null },
  { id:"appeals-basics", title:"Appealing a financial aid offer",
    body:[
      "If your family's financial situation has changed since you filed (job loss, reduced income, a new medical expense, divorce, a death) or you have a genuinely better offer from a comparable college, most financial aid offices will consider a documented appeal — sometimes called \"professional judgment\" or a \"special circumstances\" review.",
      "Appeals work best when they're specific and documented, not just \"we can't afford this.\" Bring real numbers and real documents (a layoff letter, medical bills, a competing offer).",
      "There's no guarantee of more money, and appealing is free — it costs you time, not money, and it's a completely normal, expected part of the process, not an extreme or adversarial move.",
      "This prototype includes a basic appeal-assessment structure; a fuller version with document checklists and letter drafting is intentionally deferred — see docs/EXCLUDED.md.",
    ],
    sourceKey:null },
];
function guideLink(articleId, label){
  return '<button class="why-btn" data-guide-link="' + articleId + '">' + esc(label || "Read more in the Guide →") + '</button>';
}
function renderGuide(){
  const focus = state.guideFocus;
  return '\
    <div class="card">\
      <h2>Guide</h2>\
      <p class="muted">General, non-personalized explainers — the same for every reader. Your personalized dashboard, tasks, and deadlines live in "My Roadmap"; this is background reading, not your specific to-do list.</p>\
    </div>\
    ' + GUIDE_ARTICLES.map(a => '\
      <div class="card" id="guide-' + a.id + '" style="' + (focus===a.id ? 'border-color:var(--brand);' : '') + '">\
        <h2>' + esc(a.title) + '</h2>\
        ' + a.body.map(p => '<p>' + esc(p) + '</p>').join("") + '\
        ' + (a.sourceKey ? '<p>' + whyButton(a.title, "General background reading, not tied to your specific answers.", a.sourceKey) + '</p>' : '') + '\
      </div>').join("");
}

    condition: (ctx) => ctx.savedColleges.length > 0 && ctx.savedColleges.every(c => affordabilityStatus(c, ctx).key !== "likely"),
    result: () => ({
      type:"warning", assignedTo:"either", priority:1,
      title:"Your college list has no option that currently looks clearly affordable",
      description:"That doesn't mean none of them will be — several are still 'depends on aid' until real offers or net price calculator results come in. But it's worth adding at least one option with verified, lower net cost while you wait on aid decisions.",
      explanation:"None of your saved colleges currently have a 'likely affordable' status based on what's been verified so far.",
      sourceKey:null,
      howTo:[
        "Search for at least one college with a lower published cost, or one where you're likely to get strong merit aid based on your grades/scores.",
        "Look specifically for in-state public options or colleges known for meeting full financial need.",
        "Use each college's net price calculator (linked from \"My Colleges\") for a real personalized estimate, not just the sticker price.",
        "Add that option to your list even if it's not your first choice — it protects you if other offers fall short.",
      ],
    }),
  },
  {
    id:"r-scholarship-deadline-soon",
    trigger:"A seeded scholarship deadline is within 30 days of today.",
    condition: () => SCHOLARSHIPS.some(s => daysUntil(s.deadline) >= 0 && daysUntil(s.deadline) <= 45),
    result: () => {
      const soon = SCHOLARSHIPS.filter(s => daysUntil(s.deadline) >= 0 && daysUntil(s.deadline) <= 45).sort((a,b)=>daysUntil(a.deadline)-daysUntil(b.deadline))[0];
      return { type:"task", assignedTo:"student", priority:1,
        title:"Start your " + soon.name + " application (" + daysUntil(soon.deadline) + " days left)",
        description:"Amount: " + soon.amount + ". " + soon.eligibility,
        explanation:"This scholarship's deadline is coming up soon relative to today's date.",
        sourceKey: soon.sourceKey,
        howTo:[
          "Read the full eligibility requirements on the scholarship's own official page (linked via \"Why am I seeing this?\") before starting.",
          "Gather what it typically asks for: an essay or short answers, a transcript, sometimes a recommendation letter.",
          "Draft your responses early — don't write them for the first time the night before the deadline.",
          "Submit a few days early in case the application portal has technical issues.",
        ] };
    },
  },
];

function fmtDate(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-US", {year:"numeric", month:"long", day:"numeric"});
}
function daysUntil(iso){
  const today = new Date("2026-07-27T00:00:00");
  const target = new Date(iso + "T00:00:00");
  return Math.round((target - today) / 86400000);
}
function deadlineStatusLabel(days){
  if (days < 0) return {text:"Passed", cls:"confirm"};
  if (days <= 21) return {text:"Due soon", cls:"confirm"};
  return {text:"Upcoming", cls:"reported"};
}
function affordabilityStatus(college, ctx){
  if (college.coaStatus === "requires_confirmation") return {key:"insufficient", text:"Insufficient info — cost not yet independently verified", cls:"confirm"};
  if (college.coa == null) return {key:"insufficient", text:"Must complete net price calculator", cls:"confirm"};
  // very rough placeholder affordability heuristic, purely illustrative — always paired with "depends on real aid offer"
  if (college.coa <= 40000) return {key:"potential", text:"Potentially affordable — still depends on your actual aid offer", cls:"reported"};
  return {key:"depends", text:"Depends heavily on aid — published cost alone is a stretch for a modest-income family", cls:"confirm"};
}

/* =========================================================================
   SAVE / RESUME — this prototype has no accounts, no server, and no
   browser storage (by design — see docs/PRIVACY.md). Instead, "saving" is
   an honest, self-contained code: your own roadmap data, encoded into a
   short string you keep yourself (paste it in a notes app) and paste back
   in later to restore it. Nothing is transmitted or stored anywhere.
   ========================================================================= */
function encodeState(){
  const payload = {
    answers: state.answers,
    savedCollegeIds: state.savedCollegeIds,
    completedTaskIds: state.completedTaskIds,
    role: state.role,
    offers: state.offers,
    onboardingComplete: state.onboardingComplete,
  };
  return btoa(encodeURIComponent(JSON.stringify(payload)));
}
function restoreFromCode(code){
  try {
    const payload = JSON.parse(decodeURIComponent(atob(String(code).trim())));
    state.answers = payload.answers || {};
    state.savedCollegeIds = payload.savedCollegeIds || [];
    state.completedTaskIds = payload.completedTaskIds || [];
    state.role = payload.role || "student";
    state.offers = payload.offers || [];
    state.onboardingComplete = !!payload.onboardingComplete;
    state.route = state.onboardingComplete ? "dashboard" : "welcome";
    return true;
  } catch (e) {
    return false;
  }
}

function ctxFromState(){
  return {
    householdStructure: state.answers.householdStructure,
    stateName: "California", // this build only covers California / the UC system
    savedColleges: state.savedCollegeIds.map(id => findCollege(id)),
  };
}

function computeGeneratedItems(){
  const ctx = ctxFromState();
  const items = [];
  RULES.forEach(rule => {
    if (rule.condition(ctx)) {
      const r = rule.result(ctx);
      items.push(Object.assign({ id:"rule-"+rule.id, ruleTrigger: rule.trigger }, r));
    }
  });
  return items;
}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function sourceBadge(status){
  const map = {
    verified:{cls:"verified", text:"Verified", icon:"✓"},
    reported:{cls:"reported", text:"Reported by school", icon:"✓"},
    requires_confirmation:{cls:"confirm", text:"Unconfirmed", icon:"?"},
    estimated:{cls:"estimated", text:"Estimated", icon:"~"},
  };
  const m = map[status] || map.requires_confirmation;
  return '<span class="badge plain ' + m.cls + '"><span aria-hidden="true">' + m.icon + '</span> ' + m.text + '</span>';
}

function whyButton(title, explanation, sourceKey){
  const payload = { title, explanation, sourceKey };
  return '<button class="why-btn" data-why=\'' + esc(JSON.stringify(payload)) + '\'>Why am I seeing this?</button>';
}

function render(){
  const consentRoot = document.getElementById("consent-root");
  if (consentRoot) {
    consentRoot.innerHTML = state.privacyConsent === null ? renderConsentBanner() : "";
    if (state.privacyConsent === null) attachConsentHandlers();
  }
  const root = document.getElementById("root");
  const staleModal = document.getElementById("why-backdrop");
  if (staleModal) staleModal.remove();
  const staleSaveModal = document.getElementById("save-backdrop");
  if (staleSaveModal) staleSaveModal.remove();
  if (state.route === "welcome" || !state.onboardingComplete && state.route === "welcome") {
    root.innerHTML = renderWelcome();
    attachWelcomeHandlers();
    return;
  }
  if (state.route === "onboarding") {
    root.innerHTML = renderOnboarding();
    attachOnboardingHandlers();
    return;
  }
  root.innerHTML = renderShell();
  attachShellHandlers();
  if (state.activeWhy) {
    document.body.insertAdjacentHTML("beforeend", renderWhyModal());
    attachModalHandlers();
  }
  if (state.showSaveModal) {
    document.body.insertAdjacentHTML("beforeend", renderSaveModal());
    attachSaveModalHandlers();
  }
}

function visibleSteps(){
  return ONBOARDING_STEPS.filter(s => !s.showIf || s.showIf(state.answers));
}

function renderOnboarding(){
  const steps = visibleSteps();
  const i = Math.min(state.onboardingStep, steps.length - 1);
  const step = steps[i];
  const pct = Math.round(((i) / steps.length) * 100);
  const current = state.answers[step.key];
  const optionsHtml = step.options.map(o => (
    '<label class="choice' + (current===o.value ? ' selected' : '') + '" data-key="' + step.key + '" data-value="' + esc(o.value) + '">\
      <input type="radio" name="' + step.key + '" value="' + esc(o.value) + '" ' + (current===o.value?'checked':'') + ' />\
      <span><span class="label">' + esc(o.label) + '</span>' + (o.desc ? '<span class="desc" style="display:block;">' + esc(o.desc) + '</span>' : '') + '</span>\
    </label>'
  )).join("");

  return '\
  <div class="content" style="max-width:640px;margin:0 auto;padding-top:36px;">\
    <div class="muted" style="margin-bottom:8px;">Step ' + (i+1) + ' of ' + steps.length + '</div>\
    <div class="progress-bar"><div style="width:' + pct + '%;"></div></div>\
    <div class="card">\

      ' + (step.hint ? '<p class="muted">' + esc(step.hint) + '</p>' : '') + '\

      <div style="display:flex; justify-content:space-between; margin-top:22px;">\

          <button class="btn" id="ob-next">' + (i===steps.length-1 ? "Finish → See my roadmap" : "Continue") + '</button>\
        </div>\
      </div>\
    </div>\
  </div>';
}
function attachOnboardingHandlers(){
  document.querySelectorAll('#choice-grid .choice').forEach(el => {
    el.addEventListener("click", () => {
      const key = el.getAttribute("data-key");
      const val = el.getAttribute("data-value");
      state.answers[key] = val;
      render();
    });
  });
  const back = document.getElementById("ob-back");
  const next = document.getElementById("ob-next");
  const skip = document.getElementById("ob-skip");
  if (back) back.addEventListener("click", () => { state.onboardingStep = Math.max(0, state.onboardingStep - 1); render(); });
  if (skip) skip.addEventListener("click", () => advanceOnboarding());
  if (next) next.addEventListener("click", () => advanceOnboarding());
}
function advanceOnboarding(){
  const steps = visibleSteps();
  if (state.onboardingStep >= steps.length - 1) {
    state.onboardingComplete = true;
    state.role = state.answers.who === "counselor" ? "student" : state.answers.who;
    state.route = "dashboard";
  } else {
    state.onboardingStep += 1;
  }
  render();
}

      scholarships: Number(fd.get("scholarships")) || 0,
      workStudy: Number(fd.get("workStudy")) || 0,
      loans: Number(fd.get("loans")) || 0,

function renderRoute(){

/* ---- Dashboard ---- */
const STAGES = [

  "Prepare application materials","Gather financial documents","Complete FAFSA",
  "Apply for scholarships","Track portals & verification",
  "Review decisions & offers","Appeal when appropriate","Choose an affordable college","Complete enrollment requirements",
];

function currentStageIndex(){
  const incomplete = BASE_TASKS.filter(t => !state.completedTaskIds.includes(t.id));
  if (!state.onboardingComplete) return 1;
  if (!incomplete.length) return STAGES.length;
  return Math.min.apply(null, incomplete.map(t => t.stage));
}
function allTasksForRole(role){
  const generated = computeGeneratedItems().filter(i => i.type === "task" || i.type === "escalation");
  const base = BASE_TASKS.map(t => ({ id:t.id, assignedTo:t.assignedTo, title:t.title, description:"", explanation:"A standard step for every applicant at this stage.", sourceKey:null, howTo:t.howTo }));
  const all = generated.concat(base);
  return all.filter(t => t.assignedTo === role || t.assignedTo === "either");
}

/* Reusable "how do I do this?" disclosure — used on task rows and on

const FOUR_YEAR_ANNUAL_INCREASE = 0.03; // conservative, general planning assumption — not a published UC figure
function fourYearProjection(o, giftAid){
  // UC's systemwide Tuition Stability Plan holds tuition & fees flat for a
  // student's entering cohort, but this form only collects one total COA
  // figure (not a tuition/living-cost split), so this estimates the whole
  // total growing at a conservative, clearly-labeled rate instead of
  // pretending to split out what's actually frozen. Gift aid is assumed to
  // renew at the same dollar amount each year — a real assumption, not a
  // guarantee, and it's called out below.
  let totalCoa = 0, totalGiftAid = 0;
  for (let year = 0; year < 4; year++) {
    totalCoa += o.coa * Math.pow(1 + FOUR_YEAR_ANNUAL_INCREASE, year);
    totalGiftAid += giftAid;
  }
  return { totalCoa: Math.round(totalCoa), totalGiftAid: Math.round(totalGiftAid), totalNet: Math.round(totalCoa - totalGiftAid) };
}
function renderOfferComparison(){
  const rows = state.offers.map(o => {
    const college = findCollege(o.college);
    const giftAid = o.grants + o.scholarships;
    const borrowed = o.loans + o.parentPlus;
    const netPrice = o.coa - giftAid;
    const gap = netPrice - o.workStudy - borrowed;
    const fourYear = fourYearProjection(o, giftAid);
    const warnings = [];
    if (o.parentPlus > 0) warnings.push("Parent PLUS / private loans are debt, not gift aid — don't read them as reducing your real cost the way a grant does.");
    if (o.workStudy > 0.15 * o.coa) warnings.push("Work-study is earned over the year, not cash available on day one — don't count on it to cover the first bill.");
    if (gap > 5000) warnings.push("There's a meaningful unexplained gap between total cost and everything covered — call the financial aid office and ask directly what covers it.");
    return { college, o, giftAid, borrowed, netPrice, gap, fourYear, warnings };
  });
  return '\
    <div class="card">\
      <h2>Comparison</h2>\
      <table>\
        <thead><tr><th>College</th><th>Cost of attendance</th><th>Gift aid (grants+scholarships)</th><th>Net price (year 1)</th><th>Work-study</th><th>Borrowed (loans)</th><th>Remaining gap</th><th></th></tr></thead>\
        <tbody>' + rows.map(r => '\
          <tr>\
            <td><strong>' + esc(r.college ? r.college.name : r.o.college) + '</strong>' + (r.warnings.length ? r.warnings.map(w=>'<div class="muted" style="color:var(--warn);">⚠️ ' + esc(w) + '</div>').join("") : "") + '</td>\
            <td>$' + r.o.coa.toLocaleString() + '</td>\
            <td>$' + r.giftAid.toLocaleString() + '</td>\
            <td><strong>$' + r.netPrice.toLocaleString() + '</strong></td>\
            <td>$' + r.o.workStudy.toLocaleString() + '</td>\
            <td>$' + r.borrowed.toLocaleString() + '</td>\
            <td>$' + r.gap.toLocaleString() + '</td>\
            <td><button class="btn ghost small" data-remove-offer="' + r.o.id + '">Remove</button></td>\
          </tr>').join("") + '</tbody>\
      </table>\
    </div>\
    <div class="card">\
      <h2>Estimated 4-year cost</h2>\
      <p class="muted">A rough planning estimate, not an official projection — assumes total cost of attendance grows ' + Math.round(FOUR_YEAR_ANNUAL_INCREASE*100) + '%/year and that your gift aid renews at the same dollar amount all 4 years. Neither is guaranteed: confirm actual renewal terms and any GPA/unit requirements directly with each college\'s financial aid office.</p>\
      <table>\
        <thead><tr><th>College</th><th>Est. 4-year cost</th><th>Est. 4-year gift aid</th><th>Est. 4-year net price</th></tr></thead>\
        <tbody>' + rows.map(r => '\
          <tr>\
            <td><strong>' + esc(r.college ? r.college.name : r.o.college) + '</strong></td>\
            <td>$' + r.fourYear.totalCoa.toLocaleString() + '</td>\
            <td>$' + r.fourYear.totalGiftAid.toLocaleString() + '</td>\
            <td><strong>$' + r.fourYear.totalNet.toLocaleString() + '</strong></td>\
          </tr>').join("") + '</tbody>\
      </table>\
      <p class="muted" style="margin-top:10px;">Loan payoff detail (interest, monthly payment estimates) is intentionally out of scope for this prototype pass — see docs/EXCLUDED.md.</p>\
    </div>';
}

/* ---- Family Center ---- */
function renderFamily(){
  const parentTasks = allTasksForRole("parent").filter(t => !state.completedTaskIds.includes(t.id));
  return '\
    <div class="card">\
      <h2>Family Center</h2>\
      <p class="muted">Everything here is written for the parent/contributor — not the student\'s admissions checklist.</p>\
      <h3>What "AGI" means (you\'ll see this term on FAFSA)</h3>\
      <p>Adjusted Gross Income is a specific line on a federal tax return — your total income minus certain adjustments. FAFSA asks for it because it\'s a standardized, verifiable number the government already has, not because it\'s the only thing that matters about your finances. If your income changed significantly since you filed taxes, that\'s a "special circumstances" conversation with a financial aid office, not something FAFSA\'s standard form captures on its own.</p>\
      <h3>Your tasks</h3>\
      ' + (parentTasks.length ? parentTasks.map(t => renderTaskRow(t)).join("") : '<p class="muted">No parent tasks pending right now.</p>') + '\
    </div>\
    <div class="card">\
      <h2>Share a weekly summary</h2>\
      <p>Three things to focus on this week:</p>\
      <ol>' + allTasksForRole(state.role).slice(0,3).map(t => '<li>' + esc(t.title) + '</li>').join("") + '</ol>\
      <p class="muted">(A real version of this would be copy/paste or SMS-ready, and available in the family\'s preferred language — both are on the intentionally-deferred list for this prototype pass.)</p>\
    </div>';
}

/* ---- Help / Escalation ---- */
function renderHelp(){
  return '\
    <div class="card">\
      <h2>When to get human help</h2>\
      <p class="muted">Some situations genuinely need a real person — a financial aid officer, a school counselor, or an immigration/tax professional. This app organizes information; it does not make official determinations.</p>\
      <h3>Your family situation doesn\'t fit the standard questions</h3>\
      <p>Divorced or separated parents, guardianship, or other non-standard household situations can change how FAFSA works for you — and, for private colleges that require the CSS Profile, may also involve a noncustodial-parent form or waiver. Contact the financial aid office directly at any college you\'re applying to — they handle these situations regularly and can advise on your specific circumstances.</p>\
      <h3>A deadline has passed</h3>\
      <p>Contact the office that owns that deadline immediately and ask if a late submission or extension is possible — policies vary widely and asking costs nothing.</p>\
      <h3>Immigration or tax questions</h3>\
      <p>This app cannot give legal, tax, or immigration advice, and doesn\'t try to. Free or low-cost help is often available through your school counselor, a local nonprofit immigration legal services provider, or a VITA (Volunteer Income Tax Assistance) site.</p>\
      <h3>You suspect a scam</h3>\
      <p>Legitimate colleges and the federal government never ask you to pay to submit FAFSA or to "guarantee" a scholarship. If something asks for payment or your StudentAid.gov password, stop and verify independently before responding.</p>\
      <h3>Thinking about appealing an offer</h3>\
      <p>See ' + guideLink("appeals-basics", "the Guide\'s appeals overview") + ' for what appeals are for and when they\'re worth the time.</p>\
    </div>';
}

/* ---- Privacy Policy ----
   DRAFT — written for this prototype's actual current behavior, not a
   final legal document. Before this goes live for real users, get it
   reviewed by an actual attorney, especially given California\'s CCPA/CPRA
   apply to this app\'s users (all California residents) and many users are
   minors. Update this immediately if analytics, accounts, or data
   collection change from what\'s described below. */
function renderPrivacyPolicy(){
  return '\
    <div class="card">\
      <h2>🔒 Privacy Policy</h2>\
      <div class="banner warn">⚠️ This is a first draft written for this prototype, not a reviewed legal document. It should be checked by an actual attorney before this app is used by real families — especially since California\'s privacy law (CCPA/CPRA) applies here, and many users are minors.</div>\
      <h3>What this app is</h3>\
      <p>Compass is a free, no-account educational prototype. There is no server-side database and no login — everything you enter lives only in your browser tab for that session, unless you use "Save my progress" to generate your own copyable code (see below).</p>\
      <h3>What we collect today</h3>\
      <p>If you accept analytics below, we use Google Analytics to see aggregate, anonymized usage patterns — which pages get visited, roughly how many people use the app, and similar behavioral data. Google Analytics uses cookies and may collect your IP address and device information as part of how it works; see <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google\'s own privacy policy</a> for what Google does with that data. We do not see or store your name, email, financial details, or anything you type into the roadmap through analytics — those never leave your browser unless you explicitly copy your "save code" somewhere yourself.</p>\
      <h3>What we don\'t do</h3>\
      <p>We never sell your data. We never ask for your StudentAid.gov, FAFSA, or CSS Profile password. We don\'t have accounts yet, so there\'s no persistent profile of you stored anywhere by us — your answers exist only in this browser tab (or in your own saved code) until you close it.</p>\
      <h3>Cookies</h3>\
      <p>This prototype itself sets no cookies. If you accept analytics, Google Analytics sets its own cookies in your browser, used only for the anonymized-usage purpose above.</p>\
      <h3>Your choices</h3>\
      <p>You can decline analytics entirely using the banner that appears on your first visit, or change your mind any time by clearing your browser\'s site data for this page (there\'s no in-app "change my choice" control yet in this prototype). Declining doesn\'t limit any feature of the app — analytics is purely for us to see usage, not something the app depends on to function.</p>\
      <h3>Minors</h3>\
      <p>This app is designed for high school students and their families, many of whom are minors. We don\'t knowingly collect any personal information beyond the anonymized analytics described above, and we never ask minors (or anyone) for financial account credentials.</p>\
      <h3>Changes</h3>\
      <p>Because this is an active prototype, this policy will change as real accounts, reminders, and other features described in our roadmap are built. Check back before assuming anything here still applies to a future version of this app.</p>\
      <h3>Questions</h3>\
      <p>This prototype doesn\'t yet have a support contact set up — that\'s one of the things to add before a real launch.</p>\
    </div>';
}

/* ---- Analytics + privacy consent ----
   No real GA4 property ID exists yet — GA_MEASUREMENT_ID is a placeholder.
   loadAnalytics() is fully wired but intentionally no-ops (just logs) until
   a real ID is dropped in, so this prototype never makes a live call to
   Google with a fake ID. Consent choice is NOT persisted across reloads
   (this app deliberately uses no browser storage — see docs/PRIVACY.md),
   so the banner will reappear next session; that is a known prototype
   limitation to fix once real accounts exist. */
const GA_MEASUREMENT_ID = "G-XXXXXXXXXX"; // TODO: replace with the real GA4 property ID before launch
function loadAnalytics(){
  if (!GA_MEASUREMENT_ID || GA_MEASUREMENT_ID.indexOf("XXXX") >= 0) {
    console.info("[Compass] Analytics consent accepted, but no real GA4 property ID is configured yet — skipping script injection.");
    return;
  }
  const s1 = document.createElement("script");
  s1.async = true;
  s1.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_MEASUREMENT_ID;
  document.head.appendChild(s1);
  window.dataLayer = window.dataLayer || [];
  function gtag(){ window.dataLayer.push(arguments); }
  gtag("js", new Date());
  gtag("config", GA_MEASUREMENT_ID, { anonymize_ip: true });
}
function renderConsentBanner(){
  return '\
    <div class="consent-banner" role="dialog" aria-label="Privacy and analytics consent">\
      <p>We\'d like to use Google Analytics to see anonymized, aggregate usage of this site (which pages get used, roughly how many visitors) — never your name, financial details, or anything you type into your roadmap. See our <a href="#" data-route="privacy">Privacy Policy</a>.</p>\
      <div class="actions">\
        <button class="btn secondary small" id="consent-decline">Decline</button>\
        <button class="btn small" id="consent-accept">Accept</button>\
      </div>\
    </div>';
}
function attachConsentHandlers(){
  const accept = document.getElementById("consent-accept");
  const decline = document.getElementById("consent-decline");
  if (accept) accept.addEventListener("click", () => { state.privacyConsent = "accepted"; loadAnalytics(); render(); });
  if (decline) decline.addEventListener("click", () => { state.privacyConsent = "declined"; render(); });
  document.querySelectorAll("#consent-root [data-route]").forEach(link => {
    link.addEventListener("click", (e) => {
      e.preventDefault();
      // Leave the consent choice untouched — just navigate so the policy
      // is reachable from inside the banner without accepting/declining first.
      state.route = "privacy";
      render();
    });
  });
}

/* ---- Why modal ---- */
function renderWhyModal(){
  const w = state.activeWhy;
  const src = w.sourceKey ? SOURCES[w.sourceKey] : null;
  return '\
    <div class="modal-backdrop" id="why-backdrop">\
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="why-title">\
        <h3 id="why-title">Why am I seeing this?</h3>\
        <dl>\
          <dt>Item</dt><dd>' + esc(w.title) + '</dd>\
          <dt>Because</dt><dd>' + esc(w.explanation) + '</dd>\
          ' + (src ? '<dt>Source</dt><dd>' + esc(src.title) + ' — ' + esc(src.org) + '<br/><a href="' + src.url + '" target="_blank" rel="noopener">' + src.url + '</a></dd><dt>Checked</dt><dd>' + esc(src.checked) + '</dd>' : '<dt>Source</dt><dd>Internal logic based on your answers — not tied to an external source for this item.</dd>') + '\
        </dl>\
        <div style="margin-top:16px; text-align:right;"><button class="btn secondary" id="why-close">Close</button></div>\
      </div>\
    </div>';
}
function attachModalHandlers(){
  const close = document.getElementById("why-close");
  const backdrop = document.getElementById("why-backdrop");
  if (close) close.addEventListener("click", () => { state.activeWhy = null; render(); });
  if (backdrop) backdrop.addEventListener("click", (e) => { if (e.target === backdrop) { state.activeWhy = null; render(); } });
}

/* ---- Save / resume modal ---- */
function renderSaveModal(){
  const code = encodeState();
  return '\
    <div class="modal-backdrop" id="save-backdrop">\
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="save-title">\
        <h3 id="save-title">💾 Save my progress</h3>\
        <p class="muted">There\'s no account here on purpose — nothing you enter is sent anywhere or stored on a server. This code is your whole roadmap (answers, saved colleges, completed tasks, offers), packed into text. Copy it somewhere safe (notes app, email to yourself), then paste it back in from the welcome screen to pick up right where you left off.</p>\
        <textarea readonly id="save-code" style="width:100%; min-height:90px; font-family:monospace; font-size:12px; padding:10px; border:1px solid var(--line); border-radius:8px; resize:vertical;">' + esc(code) + '</textarea>\
        <p id="save-copied" class="muted" style="color:var(--brand-dark); display:none; margin-top:6px;">Copied to your clipboard.</p>\
        <div style="margin-top:16px; display:flex; justify-content:flex-end; gap:8px;">\
          <button class="btn secondary" id="save-copy">Copy code</button>\
          <button class="btn ghost" id="save-close">Close</button>\
        </div>\
      </div>\
    </div>';
}
function attachSaveModalHandlers(){
  const close = document.getElementById("save-close");
  const backdrop = document.getElementById("save-backdrop");
  const copyBtn = document.getElementById("save-copy");
  const textarea = document.getElementById("save-code");
  if (close) close.addEventListener("click", () => { state.showSaveModal = false; render(); });
  if (backdrop) backdrop.addEventListener("click", (e) => { if (e.target === backdrop) { state.showSaveModal = false; render(); } });
  if (copyBtn) copyBtn.addEventListener("click", () => {
    const done = () => { const msg = document.getElementById("save-copied"); if (msg) msg.style.display = "block"; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(textarea.value).then(done).catch(() => { textarea.select(); document.execCommand("copy"); done(); });
    } else {
      textarea.select();
      document.execCommand("copy");
      done();
    }
  });
}

const disclaimerPrivacyLink = document.getElementById("disclaimer-privacy-link");
if (disclaimerPrivacyLink) {
  disclaimerPrivacyLink.addEventListener("click", (e) => {
    e.preventDefault();
    state.route = "privacy";
    if (!state.onboardingComplete) { state.onboardingComplete = true; state.role = state.role || "student"; }
    render();
  });
}

render();
</script>
